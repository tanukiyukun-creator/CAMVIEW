<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CAMVIEW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0d;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: min(920px, 94vw);
      padding: 24px 0 40px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 28px;
      letter-spacing: 2px;
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #151519;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #29292f;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #000;
    }

    #message {
      position: absolute;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #aaa;
      font-size: 15px;
    }

    .status {
      margin-top: 14px;
      min-height: 22px;

      color: #bbb;
      font-size: 14px;
    }

    .buttons,
    .camera-buttons,
    .talk-area,
    .quality-area {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;

      background: #fff;
      color: #111;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.97);
    }

    button.dark {
      background: #202025;
      color: #fff;
      border: 1px solid #35353d;
    }

    button.talk {
      background: #fff;
      min-width: 150px;
    }

    button.talk.active {
      background: #dcdcdc;
    }

    .camera-buttons,
    .talk-area,
    .quality-area {
      display: none;
    }

    .info {
      margin-top: 18px;
      padding: 14px;

      border-radius: 12px;
      background: #121216;
      border: 1px solid #25252b;

      color: #8f8f98;
      font-size: 12px;
      line-height: 1.7;
    }

    .telemetry {
      margin-top: 10px;

      color: #777;
      font-size: 11px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<main class="app">

  <h1>CAMVIEW</h1>

  <div class="video-box">

    <video
      id="remoteVideo"
      autoplay
      playsinline>
    </video>

    <span id="message">
      接続待機中
    </span>

  </div>

  <div
    id="status"
    class="status">
    サーバーに接続しています…
  </div>

  <div class="buttons">

    <button id="cameraButton">
      カメラを開始
    </button>

    <button id="viewerButton">
      閲覧する
    </button>

  </div>


  <div
    id="cameraButtons"
    class="camera-buttons">

    <button
      id="rearButton"
      class="dark">
      外カメラ
    </button>

    <button
      id="frontButton"
      class="dark">
      内カメラ
    </button>

  </div>


  <div
    id="talkArea"
    class="talk-area">

    <button
      id="talkButton"
      class="talk">
      押して話す
    </button>

  </div>


  <div
    id="qualityArea"
    class="quality-area">

    <button
      id="autoButton"
      class="dark">
      自動画質
    </button>

    <button
      id="quality480"
      class="dark">
      480p
    </button>

    <button
      id="quality720"
      class="dark">
      720p
    </button>

    <button
      id="quality1080"
      class="dark">
      1080p
    </button>

  </div>


  <div class="info">
    CAMVIEW はWebRTCを使用して
    端末間で映像・音声を通信します。
    通信が一時的に切れた場合は自動復旧を試みます。
  </div>

  <div
    id="telemetry"
    class="telemetry">
  </div>

</main>


<script src="/socket.io/socket.io.js"></script>

<script>

"use strict";


/* =====================================================
   基本設定
===================================================== */

const room = "camview-main";


const socket = io({
  reconnection: true,
  reconnectionAttempts: Infinity,
  reconnectionDelay: 1000,
  reconnectionDelayMax: 5000,
  timeout: 10000
});


const remoteVideo =
  document.getElementById("remoteVideo");

const message =
  document.getElementById("message");

const status =
  document.getElementById("status");

const telemetry =
  document.getElementById("telemetry");

const cameraButtons =
  document.getElementById("cameraButtons");

const talkArea =
  document.getElementById("talkArea");

const qualityArea =
  document.getElementById("qualityArea");

const talkButton =
  document.getElementById("talkButton");


/* =====================================================
   状態
===================================================== */

let peer = null;

let localStream = null;

let viewerMicStream = null;

let viewerMicTrack = null;

let isCamera = false;

let isViewer = false;

let currentFacingMode = "environment";

let currentDeviceId = null;

let iceQueue = [];

let reconnecting = false;

let recoveryTimer = null;

let recoveryGeneration = 0;

let offerInProgress = false;

let lastOfferTime = 0;

let autoQuality = true;

let currentQuality = "720";

let lastQualityChange = 0;

let goodSamples = 0;

let statsTimer = null;

let lastBytesSent = 0;

let lastStatsTime = 0;

let talkAudio = null;

let started = false;


/* =====================================================
   Socket接続
===================================================== */

socket.on("connect", async () => {

  console.log(
    "[Socket] connected",
    socket.id
  );

  status.textContent =
    "サーバーに接続しました";


  /*
   * すでにカメラ/Viewerとして
   * 動作中の場合だけ再入室する。
   */

  if (!started) {
    return;
  }


  socket.emit(
    "join",
    room
  );


  /*
   * Socket.IOの再接続直後に
   * すぐOfferを乱発しない。
   */

  await wait(1000);


  if (
    isViewer &&
    peer &&
    peer.connectionState !==
      "connected"
  ) {

    socket.emit(
      "request-offer",
      { room }
    );

  }

});


socket.on("disconnect", () => {

  console.log(
    "[Socket] disconnected"
  );

  status.textContent =
    "サーバー再接続中…";

});


socket.on("connect_error", error => {

  console.warn(
    "[Socket] connection error",
    error
  );

  status.textContent =
    "サーバーへ再接続しています…";

});


/* =====================================================
   TURN
===================================================== */

async function getIceServers() {

  try {

    const response =
      await fetch(
        "/api/turn-config",
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {
      throw new Error(
        "TURN unavailable"
      );
    }


    const data =
      await response.json();


    if (
      !data ||
      !Array.isArray(
        data.iceServers
      )
    ) {

      throw new Error(
        "Invalid TURN config"
      );

    }


    return data.iceServers;

  } catch (error) {

    console.warn(
      "[TURN] fallback to STUN",
      error
    );


    return [
      {
        urls:
          "stun:stun.l.google.com:19302"
      }
    ];

  }

}


/* =====================================================
   Peer作成
===================================================== */

async function createPeer() {

  /*
   * 既存Peerを完全に閉じる。
   * ただし、この関数は
   * 「本当に再接続が必要な時」だけ呼ぶ。
   */

  if (peer) {

    try {
      peer.ontrack = null;
      peer.onicecandidate = null;
      peer.onconnectionstatechange = null;
      peer.oniceconnectionstatechange = null;
      peer.close();
    } catch {}

  }


  peer = null;

  /*
   * 古いPeerのICEを持ち越さない。
   */

  iceQueue = [];

  const iceServers =
    await getIceServers();


  const newPeer =
    new RTCPeerConnection({

      iceServers,

      bundlePolicy:
        "max-bundle",

      rtcpMuxPolicy:
        "require",

      /*
       * 大きすぎるICE先行生成は
       * 環境によって不安定になることがあるので
       * 0にして必要な時に生成する。
       */

      iceCandidatePoolSize:
        0

    });


  peer = newPeer;


  newPeer.onicecandidate =
    event => {

      if (
        !event.candidate ||
        peer !== newPeer
      ) {
        return;
      }


      socket.emit(
        "ice-candidate",
        {
          room,
          candidate:
            event.candidate
        }
      );

    };


  newPeer.ontrack =
    event => {

      if (
        peer !== newPeer
      ) {
        return;
      }


      if (!event.streams[0]) {
        return;
      }


      const stream =
        event.streams[0];


      if (
        event.track.kind ===
        "video"
      ) {

        remoteVideo.srcObject =
          stream;

        remoteVideo.style.display =
          "block";

        message.style.display =
          "none";


        remoteVideo
          .play()
          .catch(() => {});

      }


      /*
       * Viewer → Camera
       * トーク音声
       */

      if (
        event.track.kind ===
        "audio" &&
        isCamera
      ) {

        if (!talkAudio) {

          talkAudio =
            document.createElement(
              "audio"
            );

          talkAudio.autoplay =
            true;

          talkAudio.playsInline =
            true;

          talkAudio.style.display =
            "none";

          document.body.appendChild(
            talkAudio
          );

        }


        talkAudio.srcObject =
          new MediaStream([
            event.track
          ]);


        talkAudio
          .play()
          .catch(() => {});

      }


      status.textContent =
        "映像・音声を受信しています";

    };


  newPeer.onconnectionstatechange =
    () => {

      if (
        peer !== newPeer
      ) {
        return;
      }


      const state =
        newPeer.connectionState;


      console.log(
        "[WebRTC] connectionState:",
        state
      );


      if (
        state === "connected"
      ) {

        /*
         * 接続成功したら、
         * 予約中の復旧を完全にキャンセル。
         */

        cancelRecovery();


        reconnecting =
          false;

        status.textContent =
          "接続しました";

        return;

      }


      if (
        state === "disconnected"
      ) {

        /*
         * disconnectedは
         * 一時的な回線揺れでも発生する。
         *
         * ここではPeerを作り直さない。
         */

        status.textContent =
          "接続を確認しています…";

        scheduleRecovery(
          6000
        );

        return;

      }


      if (
        state === "failed"
      ) {

        status.textContent =
          "接続が切れました。復旧しています…";

        scheduleRecovery(
          1500
        );

        return;

      }


      if (
        state === "closed"
      ) {

        /*
         * 自分でcloseした場合も
         * ここに来るので、
         * reconnecting中なら何もしない。
         */

        if (!reconnecting) {

          scheduleRecovery(
            1500
          );

        }

      }

    };


  newPeer.oniceconnectionstatechange =
    () => {

      if (
        peer !== newPeer
      ) {
        return;
      }


      const state =
        newPeer.iceConnectionState;


      console.log(
        "[WebRTC] ICE:",
        state
      );


      if (
        state === "connected" ||
        state === "completed"
      ) {

        cancelRecovery();

        status.textContent =
          "接続しました";

        return;

      }


      if (
        state === "disconnected"
      ) {

        /*
         * ICE disconnectedも
         * 即再接続しない。
         */

        scheduleRecovery(
          6000
        );

        return;

      }


      if (
        state === "failed"
      ) {

        scheduleRecovery(
          1500
        );

      }

    };


  return newPeer;

}


/* =====================================================
   カメラ取得
===================================================== */

async function getCameraTrack(
  facingMode
) {

  /*
   * まずfacingModeを指定して取得。
   * Androidではこれが最も安定する。
   */

  try {

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              exact:
                facingMode
            },

            width: {
              ideal: 1280,
              max: 1280
            },

            height: {
              ideal: 720,
              max: 720
            },

            frameRate: {
              ideal: 30,
              max: 30
            }

          },

          audio: false

        });


    return stream
      .getVideoTracks()[0];

  } catch (error) {

    console.warn(
      "[Camera] exact facingMode failed",
      error
    );

  }


  /*
   * exactで取れない端末用。
   */

  try {

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal:
                facingMode
            },

            width: {
              ideal: 1280,
              max: 1280
            },

            height: {
              ideal: 720,
              max: 720
            },

            frameRate: {
              ideal: 30,
              max: 30
            }

          },

          audio: false

        });


    return stream
      .getVideoTracks()[0];

  } catch (error) {

    console.warn(
      "[Camera] ideal facingMode failed",
      error
    );

  }


  /*
   * 最終フォールバック。
   */

  const stream =
    await navigator
      .mediaDevices
      .getUserMedia({

        video: {

          width: {
            ideal: 1280,
            max: 1280
          },

          height: {
            ideal: 720,
            max: 720
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        },

        audio: false

      });


  return stream
    .getVideoTracks()[0];

}


/* =====================================================
   カメラ開始・切替
===================================================== */

let cameraOperation = null;


async function startCamera(
  facingMode = "environment"
) {

  /*
   * カメラ切替処理が同時に2つ走らないようにする。
   */

  if (cameraOperation) {

    return cameraOperation;

  }


  cameraOperation =
    (async () => {

      status.textContent =
        "カメラを起動しています…";


      try {

        const oldVideoTrack =
          localStream
            ?.getVideoTracks()[0];


        const newVideoTrack =
          await getCameraTrack(
            facingMode
          );


        if (!newVideoTrack) {

          throw new Error(
            "カメラを取得できませんでした"
          );

        }


        currentDeviceId =
          newVideoTrack
            .getSettings()
            .deviceId ||
          null;


        currentFacingMode =
          facingMode;


        /*
         * 重要：
         *
         * カメラ切替では
         * PeerConnectionを作り直さない。
         *
         * 現在のSenderのTrackだけ交換する。
         */

        if (peer) {

          const sender =
            peer
              .getSenders()
              .find(
                s =>
                  s.track &&
                  s.track.kind ===
                  "video"
              );


          if (sender) {

            await sender.replaceTrack(
              newVideoTrack
            );

          } else {

            if (localStream) {

              peer.addTrack(
                newVideoTrack,
                localStream
              );

            }

          }

        }


        /*
         * 古い映像Trackを停止。
         */

        if (
          oldVideoTrack &&
          oldVideoTrack !==
            newVideoTrack
        ) {

          try {
            oldVideoTrack.stop();
          } catch {}

        }


        const audioTrack =
          localStream
            ?.getAudioTracks()[0];


        if (audioTrack) {

          localStream =
            new MediaStream([
              newVideoTrack,
              audioTrack
            ]);

        } else {

          localStream =
            new MediaStream([
              newVideoTrack
            ]);

        }


        attachTrackRecovery(
          newVideoTrack
        );


        status.textContent =
          facingMode ===
          "environment"
            ? "外カメラで動作中"
            : "内カメラで動作中";


        return true;

      } catch (error) {

        console.error(
          "[Camera] error:",
          error
        );


        status.textContent =
          "カメラを取得できませんでした: "
          + error.name;


        return false;

      }

    })();


  try {

    return await cameraOperation;

  } finally {

    cameraOperation =
      null;

  }

}


/* =====================================================
   カメラTrack監視
===================================================== */

const trackRecoveryLocks =
  new WeakSet();


function attachTrackRecovery(
  track
) {

  if (!track) {
    return;
  }


  /*
   * 同じTrackに何度も
   * listenerを付けない。
   */

  if (
    trackRecoveryLocks.has(track)
  ) {

    return;

  }


  trackRecoveryLocks.add(track);


  track.addEventListener(
    "ended",
    () => {

      if (!isCamera) {
        return;
      }


      /*
       * 本当に終了した場合だけ復旧。
       */

      if (
        track.readyState ===
        "ended"
      ) {

        setTimeout(
          () => {

            if (
              isCamera &&
              localStream
                ?.getVideoTracks()
                .includes(track)
            ) {

              recoverCamera();

            }

          },
          1500
        );

      }

    }
  );

}


/* =====================================================
   カメラ復旧
===================================================== */

let cameraRecoveryRunning =
  false;


async function recoverCamera() {

  if (
    !isCamera ||
    cameraRecoveryRunning
  ) {

    return;

  }


  cameraRecoveryRunning =
    true;


  try {

    const currentTrack =
      localStream
        ?.getVideoTracks()[0];


    if (
      currentTrack &&
      currentTrack.readyState !==
        "ended"
    ) {

      /*
       * muteしただけなら
       * カメラを作り直さない。
       */

      return;

    }


    status.textContent =
      "カメラを復旧しています…";


    await startCamera(
      currentFacingMode
    );


  } finally {

    cameraRecoveryRunning =
      false;

  }

}


/* =====================================================
   カメラ開始
===================================================== */

document
  .getElementById(
    "cameraButton"
  )
  .addEventListener(
    "click",
    async () => {

      if (started) {
        return;
      }


      isCamera = true;
      isViewer = false;
      started = true;


      cameraButtons.style.display =
        "flex";

      qualityArea.style.display =
        "flex";

      talkArea.style.display =
        "none";


      try {

        /*
         * 最初のカメラ取得。
         */

        const videoStream =
          await navigator
            .mediaDevices
            .getUserMedia({

              video: {

                facingMode: {
                  ideal:
                    "environment"
                },

                width: {
                  ideal: 1280,
                  max: 1280
                },

                height: {
                  ideal: 720,
                  max: 720
                },

                frameRate: {
                  ideal: 30,
                  max: 30
                }

              },

              audio: {

                echoCancellation:
                  true,

                noiseSuppression:
                  true,

                autoGainControl:
                  true

              }

            });


        localStream =
          videoStream;


        const videoTrack =
          localStream
            .getVideoTracks()[0];


        const audioTrack =
          localStream
            .getAudioTracks()[0];


        if (videoTrack) {

          currentDeviceId =
            videoTrack
              .getSettings()
              .deviceId ||
            null;

          attachTrackRecovery(
            videoTrack
          );

        }


        if (audioTrack) {

          attachTrackRecovery(
            audioTrack
          );

        }


        /*
         * Peer作成。
         */

        await createPeer();


        localStream
          .getTracks()
          .forEach(
            track => {

              peer.addTrack(
                track,
                localStream
              );

            }
          );


        socket.emit(
          "join",
          room
        );


        status.textContent =
          "カメラとして待機中";


        startAutoQuality();


      } catch (error) {

        console.error(
          "[Camera start]",
          error
        );


        started = false;
        isCamera = false;


        status.textContent =
          "カメラ・マイクを使用できません: "
          + error.name;

      }

    }
  );


/* =====================================================
   Viewer開始
===================================================== */

document
  .getElementById(
    "viewerButton"
  )
  .addEventListener(
    "click",
    async () => {

      if (started) {
        return;
      }


      isViewer = true;
      isCamera = false;
      started = true;


      cameraButtons.style.display =
        "flex";

      talkArea.style.display =
        "flex";

      qualityArea.style.display =
        "none";


      try {

        viewerMicStream =
          await navigator
            .mediaDevices
            .getUserMedia({

              audio: {

                echoCancellation:
                  true,

                noiseSuppression:
                  true,

                autoGainControl:
                  true

              },

              video: false

            });


        viewerMicTrack =
          viewerMicStream
            .getAudioTracks()[0];


        viewerMicTrack.enabled =
          false;


        await createPeer();


        peer.addTrack(
          viewerMicTrack,
          viewerMicStream
        );


        socket.emit(
          "join",
          room
        );


        status.textContent =
          "カメラを探しています…";


        await wait(500);


        if (socket.connected) {

          socket.emit(
            "request-offer",
            { room }
          );

        }

      } catch (error) {

        console.error(
          "[Viewer start]",
          error
        );


        started = false;
        isViewer = false;


        status.textContent =
          "マイクを使用できません: "
          + error.name;

      }

    }
  );


/* =====================================================
   カメラ切替
===================================================== */

document
  .getElementById(
    "rearButton"
  )
  .addEventListener(
    "click",
    () => {

      socket.emit(
        "switch-camera",
        {
          room,
          camera:
            "environment"
        }
      );


      status.textContent =
        "外カメラへ切り替えています…";

    }
  );


document
  .getElementById(
    "frontButton"
  )
  .addEventListener(
    "click",
    () => {

      socket.emit(
        "switch-camera",
        {
          room,
          camera:
            "user"
        }
      );


      status.textContent =
        "内カメラへ切り替えています…";

    }
  );


socket.on(
  "switch-camera",
  async data => {

    if (!isCamera) {
      return;
    }


    await startCamera(
      data.camera
    );

  }
);


/* =====================================================
   Offer
===================================================== */

async function makeOffer() {

  if (
    !isCamera ||
    !peer ||
    !localStream ||
    reconnecting
  ) {

    return;

  }


  /*
   * Offer連打防止。
   */

  if (offerInProgress) {
    return;
  }


  /*
   * 直前のOfferから短すぎる場合は
   * もう一度送らない。
   */

  if (
    Date.now() -
    lastOfferTime <
    1500
  ) {

    return;

  }


  /*
   * stable以外からOfferを作らない。
   */

  if (
    peer.signalingState !==
    "stable"
  ) {

    console.log(
      "[WebRTC] skip offer, signalingState:",
      peer.signalingState
    );

    return;

  }


  offerInProgress =
    true;


  try {

    const offer =
      await peer.createOffer({

        offerToReceiveAudio:
          true,

        offerToReceiveVideo:
          true

      });


    if (
      !peer ||
      peer.signalingState !==
        "stable"
    ) {

      return;

    }


    await peer.setLocalDescription(
      offer
    );


    socket.emit(
      "offer",
      {
        room,
        offer
      }
    );


    lastOfferTime =
      Date.now();


  } catch (error) {

    console.error(
      "[Offer]",
      error
    );

  } finally {

    offerInProgress =
      false;

  }

}


/* =====================================================
   Offer要求
===================================================== */

socket.on(
  "request-offer",
  async () => {

    if (
      isCamera &&
      peer &&
      peer.connectionState !==
        "connected"
    ) {

      await makeOffer();

    }

  }
);


/* =====================================================
   Peer入室
===================================================== */

socket.on(
  "peer-joined",
  async () => {

    if (!isCamera) {
      return;
    }


    /*
     * 入室直後の瞬間的なOffer競合を避ける。
     */

    await wait(700);


    if (
      peer &&
      peer.connectionState !==
        "connected"
    ) {

      await makeOffer();

    }

  }
);


/* =====================================================
   Offer受信
===================================================== */

socket.on(
  "offer",
  async offer => {

    if (!isViewer) {
      return;
    }


    try {

      if (!peer) {

        await createPeer();


        if (
          viewerMicTrack &&
          viewerMicStream
        ) {

          peer.addTrack(
            viewerMicTrack,
            viewerMicStream
          );

        }

      }


      /*
       * ViewerはOfferを受け取る側。
       */

      if (
        peer.signalingState !==
        "stable"
      ) {

        console.warn(
          "[Offer] ignore because signalingState:",
          peer.signalingState
        );

        return;

      }


      await peer.setRemoteDescription(
        new RTCSessionDescription(
          offer
        )
      );


      await flushIce();


      const answer =
        await peer.createAnswer();


      await peer.setLocalDescription(
        answer
      );


      socket.emit(
        "answer",
        {
          room,
          answer
        }
      );


      status.textContent =
        "接続処理中…";


    } catch (error) {

      console.error(
        "[Offer receive]",
        error
      );


      status.textContent =
        "接続処理でエラーが発生しました";

    }

  }
);


/* =====================================================
   Answer
===================================================== */

socket.on(
  "answer",
  async answer => {

    if (!isCamera) {
      return;
    }


    try {

      if (!peer) {
        return;
      }


      /*
       * Camera側がOfferを送って
       * ViewerからAnswerを待っている状態。
       */

      if (
        peer.signalingState !==
        "have-local-offer"
      ) {

        console.warn(
          "[Answer] unexpected signalingState:",
          peer.signalingState
        );

        return;

      }


      await peer.setRemoteDescription(
        new RTCSessionDescription(
          answer
        )
      );


      await flushIce();


    } catch (error) {

      console.error(
        "[Answer]",
        error
      );

    }

  }
);


/* =====================================================
   ICE
===================================================== */

socket.on(
  "ice-candidate",
  async candidate => {

    if (!candidate) {
      return;
    }


    if (!peer) {

      iceQueue.push(
        candidate
      );

      return;

    }


    if (
      peer.remoteDescription &&
      peer.remoteDescription.type
    ) {

      try {

        await peer.addIceCandidate(
          candidate
        );

      } catch (error) {

        console.warn(
          "[ICE]",
          error
        );

      }

    } else {

      iceQueue.push(
        candidate
      );

    }

  }
);


async function flushIce() {

  if (!peer) {
    return;
  }


  if (
    !peer.remoteDescription ||
    !peer.remoteDescription.type
  ) {

    return;

  }


  const queue =
    [...iceQueue];


  iceQueue = [];


  for (
    const candidate
    of queue
  ) {

    try {

      await peer.addIceCandidate(
        candidate
      );

    } catch (error) {

      console.warn(
        "[ICE queue]",
        error
      );

    }

  }

}


/* =====================================================
   トーク
===================================================== */

function talkStart(event) {

  if (
    !isViewer ||
    !viewerMicTrack
  ) {

    return;

  }


  event.preventDefault();


  viewerMicTrack.enabled =
    true;


  talkButton.classList.add(
    "active"
  );


  talkButton.textContent =
    "話しています…";

}


function talkStop(event) {

  if (
    !isViewer ||
    !viewerMicTrack
  ) {

    return;

  }


  event.preventDefault();


  viewerMicTrack.enabled =
    false;


  talkButton.classList.remove(
    "active"
  );


  talkButton.textContent =
    "押して話す";

}


talkButton.addEventListener(
  "pointerdown",
  talkStart
);

talkButton.addEventListener(
  "pointerup",
  talkStop
);

talkButton.addEventListener(
  "pointercancel",
  talkStop
);


/* =====================================================
   画質
===================================================== */

const profiles = {

  "480": {
    width: 854,
    height: 480,
    fps: 15,
    bitrate: 700000
  },

  "720": {
    width: 1280,
    height: 720,
    fps: 30,
    bitrate: 1800000
  },

  "1080": {
    width: 1920,
    height: 1080,
    fps: 30,
    bitrate: 3500000
  }

};


async function applyQuality(
  quality
) {

  if (
    !isCamera ||
    !localStream ||
    !peer
  ) {

    return;

  }


  const profile =
    profiles[quality];


  if (!profile) {
    return;
  }


  const videoTrack =
    localStream
      .getVideoTracks()[0];


  if (!videoTrack) {
    return;
  }


  try {

    await videoTrack.applyConstraints({

      width: {
        ideal:
          profile.width
      },

      height: {
        ideal:
          profile.height
      },

      frameRate: {
        ideal:
          profile.fps,
        max:
          profile.fps
      }

    });


    const sender =
      peer
        .getSenders()
        .find(
          s =>
            s.track &&
            s.track.kind ===
            "video"
        );


    if (sender) {

      const params =
        sender.getParameters();


      if (!params.encodings) {

        params.encodings =
          [{}];

      }


      params.encodings[0]
        .maxBitrate =
          profile.bitrate;


      await sender.setParameters(
        params
      );

    }


    currentQuality =
      quality;

    lastQualityChange =
      Date.now();


    goodSamples =
      0;


  } catch (error) {

    console.error(
      "[Quality]",
      error
    );

  }

}


document
  .getElementById(
    "quality480"
  )
  .onclick = () => {

    autoQuality =
      false;

    applyQuality(
      "480"
    );

  };


document
  .getElementById(
    "quality720"
  )
  .onclick = () => {

    autoQuality =
      false;

    applyQuality(
      "720"
    );

  };


document
  .getElementById(
    "quality1080"
  )
  .onclick = () => {

    autoQuality =
      false;

    applyQuality(
      "1080"
    );

  };


document
  .getElementById(
    "autoButton"
  )
  .onclick = () => {

    autoQuality =
      true;

    goodSamples =
      0;

    status.textContent =
      "自動画質調整を開始しました";

  };


/* =====================================================
   自動画質
===================================================== */

function startAutoQuality() {

  if (statsTimer) {

    clearInterval(
      statsTimer
    );

  }


  statsTimer =
    setInterval(
      checkNetwork,
      4000
    );

}


async function checkNetwork() {

  if (
    !isCamera ||
    !autoQuality ||
    !peer ||
    peer.connectionState !==
      "connected"
  ) {

    return;

  }


  try {

    const stats =
      await peer.getStats();


    let outboundBytes =
      0;

    let rtt =
      0;


    stats.forEach(
      report => {

        /*
         * Camera側なので
         * inboundではなく
         * outboundを見る。
         */

        if (
          report.type ===
          "outbound-rtp" &&
          report.kind ===
          "video"
        ) {

          outboundBytes =
            report.bytesSent || 0;

        }


        if (
          report.type ===
          "candidate-pair" &&
          report.state ===
          "succeeded"
        ) {

          if (
            typeof report.currentRoundTripTime ===
            "number"
          ) {

            rtt =
              report.currentRoundTripTime *
              1000;

          }

        }

      }
    );


    const now =
      Date.now();


    let bitrate =
      0;


    if (
      lastStatsTime > 0
    ) {

      const bytesDelta =
        Math.max(
          0,
          outboundBytes -
          lastBytesSent
        );


      const timeDelta =
        Math.max(
          1,
          now -
          lastStatsTime
        );


      bitrate =
        bytesDelta *
        8 *
        1000 /
        timeDelta;

    }


    lastBytesSent =
      outboundBytes;

    lastStatsTime =
      now;


    telemetry.textContent =
      `品質 ${currentQuality}p / ` +
      `RTT ${Math.round(rtt)}ms / ` +
      `送信 ${(bitrate / 1000000).toFixed(2)}Mbps`;


    /*
     * 極端に悪い時だけ下げる。
     *
     * 頻繁な画質変更そのものが
     * 通信を不安定にするのを防ぐ。
     */

    const bad =
      rtt > 500 ||
      (
        bitrate > 0 &&
        bitrate < 350000
      );


    const good =
      rtt > 0 &&
      rtt < 180 &&
      bitrate > 1000000;


    const elapsed =
      Date.now() -
      lastQualityChange;


    if (
      bad &&
      elapsed > 15000
    ) {

      goodSamples =
        0;


      if (
        currentQuality ===
        "1080"
      ) {

        await applyQuality(
          "720"
        );

      } else if (
        currentQuality ===
        "720"
      ) {

        await applyQuality(
          "480"
        );

      }


      return;

    }


    if (good) {

      goodSamples++;

    } else {

      goodSamples =
        0;

    }


    /*
     * 良好な状態が
     * 十分長く続いた時だけ上げる。
     */

    if (
      goodSamples >= 5 &&
      elapsed > 30000
    ) {

      if (
        currentQuality ===
        "480"
      ) {

        await applyQuality(
          "720"
        );

      } else if (
        currentQuality ===
        "720"
      ) {

        await applyQuality(
          "1080"
        );

      }


      goodSamples =
        0;

    }

  } catch (error) {

    console.warn(
      "[Stats]",
      error
    );

  }

}


/* =====================================================
   復旧制御
===================================================== */

function cancelRecovery() {

  recoveryGeneration++;


  if (recoveryTimer) {

    clearTimeout(
      recoveryTimer
    );

    recoveryTimer =
      null;

  }

}


function scheduleRecovery(
  delay = 4000
) {

  if (
    !started ||
    reconnecting
  ) {

    return;

  }


  /*
   * すでに予約済みなら
   * 何もしない。
   */

  if (recoveryTimer) {

    return;

  }


  const generation =
    recoveryGeneration;


  recoveryTimer =
    setTimeout(
      async () => {

        recoveryTimer =
          null;


        /*
         * その間に接続が戻ったら
         * 復旧しない。
         */

        if (
          generation !==
          recoveryGeneration
        ) {

          return;

        }


        if (
          peer &&
          peer.connectionState ===
            "connected"
        ) {

          return;

        }


        await recoverConnection();

      },
      delay
    );

}


/* =====================================================
   Peer再接続
===================================================== */

async function recoverConnection() {

  if (
    reconnecting ||
    !started
  ) {

    return;

  }


  /*
   * disconnectedだけなら、
   * もう一度状態を確認してから作り直す。
   */

  if (
    peer &&
    peer.connectionState ===
      "disconnected"
  ) {

    await wait(2000);


    if (
      peer &&
      peer.connectionState ===
        "connected"
    ) {

      return;

    }

  }


  reconnecting =
    true;


  recoveryGeneration++;


  status.textContent =
    "接続を復旧しています…";


  try {

    /*
     * 新しいPeerを作る。
     */

    await createPeer();


    /*
     * Camera
     */

    if (isCamera) {

      if (!localStream) {

        throw new Error(
          "localStream unavailable"
        );

      }


      localStream
        .getTracks()
        .forEach(
          track => {

            if (
              !track.ended
            ) {

              peer.addTrack(
                track,
                localStream
              );

            }

          }
        );


      socket.emit(
        "join",
        room
      );


      await wait(800);


      /*
       * Viewerが既にいる場合だけ
       * Offerを送る。
       */

      if (
        socket.connected
      ) {

        await makeOffer();

      }

    }


    /*
     * Viewer
     */

    if (isViewer) {

      if (
        viewerMicTrack &&
        viewerMicStream &&
        !viewerMicTrack.ended
      ) {

        peer.addTrack(
          viewerMicTrack,
          viewerMicStream
        );

      }


      socket.emit(
        "join",
        room
      );


      await wait(800);


      if (
        socket.connected
      ) {

        socket.emit(
          "request-offer",
          { room }
        );

      }

    }

  } catch (error) {

    console.error(
      "[Recovery]",
      error
    );


    status.textContent =
      "復旧に失敗しました。再試行します…";


    /*
     * 失敗しても即ループさせない。
     */

    setTimeout(
      () => {

        if (
          started &&
          !peer?.connectionState ===
            "connected"
        ) {

          scheduleRecovery(
            5000
          );

        }

      },
      5000
    );

  } finally {

    reconnecting =
      false;

  }

}


/* =====================================================
   復帰チェック
===================================================== */

async function checkAfterResume() {

  if (!started) {
    return;
  }


  /*
   * ここではPeerを
   * いきなり作り直さない。
   */

  if (
    peer &&
    peer.connectionState ===
      "connected"
  ) {

    status.textContent =
      "接続中";

    return;

  }


  if (
    peer &&
    (
      peer.connectionState ===
        "disconnected" ||
      peer.connectionState ===
        "connecting"
    )
  ) {

    status.textContent =
      "接続を確認しています…";

    /*
     * しばらく待ってから判断。
     */

    scheduleRecovery(
      5000
    );

    return;

  }


  if (
    !peer ||
    peer.connectionState ===
      "failed" ||
    peer.connectionState ===
      "closed"
  ) {

    scheduleRecovery(
      1500
    );

  }

}


/* =====================================================
   visibility
===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      /*
       * 復帰しただけでは
       * Peerを作り直さない。
       */

      setTimeout(
        checkAfterResume,
        1500
      );

    }

  }
);


/* =====================================================
   pageshow
===================================================== */

window.addEventListener(
  "pageshow",
  () => {

    setTimeout(
      checkAfterResume,
      1500
    );

  }
);


/* =====================================================
   focus
===================================================== */

window.addEventListener(
  "focus",
  () => {

    setTimeout(
      checkAfterResume,
      1500
    );

  }
);


/* =====================================================
   Network
===================================================== */

window.addEventListener(
  "online",
  () => {

    status.textContent =
      "ネットワーク復旧。接続を確認しています…";


    /*
     * すぐPeerを壊さない。
     */

    setTimeout(
      checkAfterResume,
      2000
    );

  }
);


window.addEventListener(
  "offline",
  () => {

    status.textContent =
      "オフラインです。ネットワーク復旧を待っています…";

  }
);


/* =====================================================
   待機
===================================================== */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =====================================================
   初期表示
===================================================== */

status.textContent =
  "CAMVIEW 起動中…";

</script>
