<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>CAMVIEW</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #09090b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      width: min(1100px, 100%);
      margin: auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #151518;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #000;
    }

    #message {
      color: #777;
      font-size: 16px;
    }

    .status {
      margin-top: 14px;
      color: #aaa;
      font-size: 14px;
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      background: #fff;
      color: #111;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .camera-buttons {
      display: none;
      margin-top: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .camera-buttons button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
    }

  </style>

</head>

<body>

  <main class="app">

    <h1>CAMVIEW</h1>

    <div class="video-box">

      <video
        id="remoteVideo"
        autoplay
        playsinline>
      </video>

      <span id="message">
        接続待機中
      </span>

    </div>

    <div
      class="status"
      id="status">

      サーバーに接続しています…

    </div>

    <div class="buttons">

      <button id="cameraButton">
        カメラを開始
      </button>

      <button id="viewerButton">
        閲覧する
      </button>

    </div>

    <div
      class="camera-buttons"
      id="cameraButtons">

      <button id="rearButton">
        外カメラ
      </button>

      <button id="frontButton">
        内カメラ
      </button>

    </div>

  </main>

  <script src="/socket.io/socket.io.js"></script>

  <script>

    // =====================================
    // Socket.IO
    // =====================================

    const socket = io();

    const room = "camview-main";

    const remoteVideo =
      document.getElementById(
        "remoteVideo"
      );

    const message =
      document.getElementById(
        "message"
      );

    const status =
      document.getElementById(
        "status"
      );

    const cameraButtons =
      document.getElementById(
        "cameraButtons"
      );

    let peer = null;

    let localStream = null;

    let pendingIceCandidates = [];

    let iceServersConfig = [
      {
        urls:
          "stun:stun.l.google.com:19302"
      }
    ];


    // =====================================
    // サーバー接続
    // =====================================

    socket.on(
      "connect",
      () => {

        status.textContent =
          "サーバーに接続しました";

      }
    );


    socket.on(
      "disconnect",
      () => {

        status.textContent =
          "サーバーから切断されました";

      }
    );


    // =====================================
    // TURN設定取得
    // =====================================

    async function loadTurnConfig() {

      try {

        const response =
          await fetch(
            "/api/turn-config",
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            "TURN_CONFIG_UNAVAILABLE"
          );
        }

        const data =
          await response.json();

        if (
          Array.isArray(
            data.iceServers
          ) &&
          data.iceServers.length > 0
        ) {

          iceServersConfig =
            data.iceServers;

          console.log(
            "TURN設定を読み込みました"
          );

        }

      } catch (error) {

        console.warn(
          "TURN設定を取得できませんでした。",
          error
        );

        console.warn(
          "STUNで接続を試します。"
        );

      }

    }


    // =====================================
    // ICE Candidate処理
    // =====================================

    async function applyPendingIceCandidates() {

      if (
        !peer ||
        !peer.remoteDescription
      ) {
        return;
      }

      const candidates =
        pendingIceCandidates;

      pendingIceCandidates = [];

      for (
        const candidate of candidates
      ) {

        try {

          await peer.addIceCandidate(
            candidate
          );

        } catch (error) {

          console.warn(
            "ICE candidate error:",
            error
          );

        }

      }

    }


    // =====================================
    // 送信画質設定
    // =====================================

    async function tuneSender(
      sender
    ) {

      if (
        !sender ||
        !sender.getParameters
      ) {
        return;
      }

      try {

        const parameters =
          sender.getParameters();

        if (
          !parameters.encodings ||
          parameters.encodings.length === 0
        ) {

          parameters.encodings = [
            {}
          ];

        }

        parameters
          .encodings[0]
          .maxBitrate =
          2500000;

        parameters
          .encodings[0]
          .maxFramerate =
          30;

        if (
          "degradationPreference"
          in parameters
        ) {

          parameters
            .degradationPreference =
            "maintain-resolution";

        }

        await sender.setParameters(
          parameters
        );

      } catch (error) {

        console.warn(
          "送信品質設定を適用できませんでした:",
          error
        );

      }

    }


    // =====================================
    // PeerConnection
    // =====================================

    function createPeer() {

      peer =
        new RTCPeerConnection({

          iceServers:
            iceServersConfig,

          bundlePolicy:
            "max-bundle",

          rtcpMuxPolicy:
            "require",

          iceCandidatePoolSize:
            10

        });


      // -----------------------------
      // ICE
      // -----------------------------

      peer.onicecandidate =
        event => {

          if (
            !event.candidate
          ) {
            return;
          }

          socket.emit(
            "ice-candidate",
            {
              room,
              candidate:
                event.candidate
            }
          );

        };


      // -----------------------------
      // Remote Track
      // -----------------------------

      peer.ontrack =
        event => {

          if (
            !event.streams ||
            !event.streams[0]
          ) {
            return;
          }

          remoteVideo.srcObject =
            event.streams[0];

          remoteVideo.style.display =
            "block";

          message.style.display =
            "none";

          status.textContent =
            "映像・音声を受信しています";

          remoteVideo
            .play()
            .catch(() => {});

        };


      // -----------------------------
      // Connection State
      // -----------------------------

      peer.onconnectionstatechange =
        () => {

          const state =
            peer.connectionState;

          console.log(
            "connectionState:",
            state
          );

          if (
            state === "connected"
          ) {

            status.textContent =
              "接続しました";

          }

          if (
            state === "connecting"
          ) {

            status.textContent =
              "接続しています…";

          }

          if (
            state === "disconnected"
          ) {

            status.textContent =
              "接続が不安定です";

          }

          if (
            state === "failed"
          ) {

            status.textContent =
              "接続に失敗しました";

          }

        };


      // -----------------------------
      // ICE Connection State
      // -----------------------------

      peer.oniceconnectionstatechange =
        () => {

          console.log(
            "iceConnectionState:",
            peer.iceConnectionState
          );

        };

    }


    // =====================================
    // カメラ取得
    // =====================================

    async function startCamera(
      facingMode
    ) {

      status.textContent =
        "カメラを切り替えています…";

      try {

        const oldVideoTrack =
          localStream
            ? localStream.getVideoTracks()[0]
            : null;


        // 映像だけ取得
        // マイクは既存のものを維持する
        const newVideoStream =
          await navigator
            .mediaDevices
            .getUserMedia({

              video: {

                width: {
                  ideal: 1280,
                  max: 1280
                },

                height: {
                  ideal: 720,
                  max: 720
                },

                frameRate: {
                  ideal: 30,
                  max: 30
                },

                facingMode

              },

              audio: false

            });


        const videoTrack =
          newVideoStream
            .getVideoTracks()[0];


        if (!videoTrack) {

          throw new Error(
            "VIDEO_TRACK_NOT_FOUND"
          );

        }


        // 古い映像を停止
        if (oldVideoTrack) {
          oldVideoTrack.stop();
        }


        // 既存音声を維持
        const audioTrack =
          localStream
            ? localStream
                .getAudioTracks()[0]
            : null;


        if (audioTrack) {

          localStream =
            new MediaStream([
              audioTrack,
              videoTrack
            ]);

        } else {

          localStream =
            new MediaStream([
              videoTrack
            ]);

        }


        // WebRTCの映像トラックだけ交換
        if (peer) {

          const sender =
            peer
              .getSenders()
              .find(
                sender =>
                  sender.track &&
                  sender.track.kind ===
                    "video"
              );


          if (sender) {

            await sender.replaceTrack(
              videoTrack
            );

            await tuneSender(
              sender
            );

          } else {

            const newSender =
              peer.addTrack(
                videoTrack,
                localStream
              );

            await tuneSender(
              newSender
            );

          }

        }


        status.textContent =
          facingMode ===
          "environment"
            ? "外カメラに切り替えました"
            : "内カメラに切り替えました";

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "カメラ切替エラー: " +
          error.name;

      }

    }


    // =====================================
    // カメラ開始
    // =====================================

    document
      .getElementById(
        "cameraButton"
      )
      .addEventListener(
        "click",
        async () => {

          status.textContent =
            "接続設定を準備しています…";

          await loadTurnConfig();


          status.textContent =
            "カメラとマイクを起動しています…";


          try {

            localStream =
              await navigator
                .mediaDevices
                .getUserMedia({

                  video: {

                    width: {
                      ideal: 1280,
                      max: 1280
                    },

                    height: {
                      ideal: 720,
                      max: 720
                    },

                    frameRate: {
                      ideal: 30,
                      max: 30
                    },

                    facingMode:
                      "environment"

                  },

                  audio: {

                    echoCancellation:
                      true,

                    noiseSuppression:
                      true,

                    autoGainControl:
                      true

                  }

                });


            createPeer();


            // addTrackを順番に処理
            for (
              const track of
              localStream.getTracks()
            ) {

              const sender =
                peer.addTrack(
                  track,
                  localStream
                );

              if (
                track.kind ===
                "video"
              ) {

                await tuneSender(
                  sender
                );

              }

            }


            socket.emit(
              "join",
              room
            );


            status.textContent =
              "カメラとして接続中";


          }

          catch (error) {

            console.error(error);

            status.textContent =
              "カメラ・マイクを使用できません: " +
              error.name;

          }

        }
      );


    // =====================================
    // 閲覧開始
    // =====================================

    document
      .getElementById(
        "viewerButton"
      )
      .addEventListener(
        "click",
        async () => {

          status.textContent =
            "接続設定を準備しています…";


          await loadTurnConfig();


          createPeer();


          socket.emit(
            "join",
            room
          );


          status.textContent =
            "カメラを探しています…";


          cameraButtons.style.display =
            "flex";

        }
      );


    // =====================================
    // 外カメラ
    // =====================================

    document
      .getElementById(
        "rearButton"
      )
      .addEventListener(
        "click",
        () => {

          socket.emit(
            "switch-camera",
            {
              room,
              camera:
                "environment"
            }
          );

          status.textContent =
            "外カメラへ切り替えています…";

        }
      );


    // =====================================
    // 内カメラ
    // =====================================

    document
      .getElementById(
        "frontButton"
      )
      .addEventListener(
        "click",
        () => {

          socket.emit(
            "switch-camera",
            {
              room,
              camera:
                "user"
            }
          );

          status.textContent =
            "内カメラへ切り替えています…";

        }
      );


    // =====================================
    // カメラ側：カメラ切替命令
    // =====================================

    socket.on(
      "switch-camera",
      async data => {

        if (
          !localStream ||
          !data ||
          !data.camera
        ) {
          return;
        }

        await startCamera(
          data.camera
        );

      }
    );


    // =====================================
    // 相手が入室
    // =====================================

    socket.on(
      "peer-joined",
      async () => {

        if (
          !localStream ||
          !peer
        ) {
          return;
        }

        try {

          const offer =
            await peer.createOffer({

              offerToReceiveAudio:
                true,

              offerToReceiveVideo:
                true

            });


          await peer.setLocalDescription(
            offer
          );


          socket.emit(
            "offer",
            {
              room,
              offer
            }
          );

        }

        catch (error) {

          console.error(
            "Offer error:",
            error
          );

        }

      }
    );


    // =====================================
    // Offer受信
    // =====================================

    socket.on(
      "offer",
      async offer => {

        try {

          if (!peer) {
            createPeer();
          }


          await peer.setRemoteDescription(
            offer
          );


          await applyPendingIceCandidates();


          const answer =
            await peer.createAnswer();


          await peer.setLocalDescription(
            answer
          );


          socket.emit(
            "answer",
            {
              room,
              answer
            }
          );

        }

        catch (error) {

          console.error(
            "Answer error:",
            error
          );

          status.textContent =
            "接続処理でエラーが発生しました";

        }

      }
    );


    // =====================================
    // Answer受信
    // =====================================

    socket.on(
      "answer",
      async answer => {

        try {

          if (!peer) {
            return;
          }


          await peer.setRemoteDescription(
            answer
          );


          await applyPendingIceCandidates();

        }

        catch (error) {

          console.error(
            "Remote description error:",
            error
          );

        }

      }
    );


    // =====================================
    // ICE Candidate
    // =====================================

    socket.on(
      "ice-candidate",
      async candidate => {

        try {

          if (!peer) {
            return;
          }


          // RemoteDescriptionより先に
          // ICEが届いた場合は一旦保存
          if (
            !peer.remoteDescription
          ) {

            pendingIceCandidates.push(
              candidate
            );

            return;

          }


          await peer.addIceCandidate(
            candidate
          );

        }

        catch (error) {

          console.warn(
            "ICE candidate error:",
            error
          );

        }

      }
    );


    // =====================================
    // 起動時
    // =====================================

    loadTurnConfig();

  </script>

</body>

</html>
