<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0">

<title>CAMVIEW</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #09090b;
  color: white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.app {
  width: min(1100px, 100%);
  margin: auto;
  padding: 24px;
}

h1 {
  margin: 0 0 20px;
  font-size: 28px;
}

.video-box {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #151518;
  border-radius: 18px;
  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
  background: #000;
}

#message {
  color: #777;
}

.status {
  margin-top: 14px;
  color: #aaa;
  font-size: 14px;
}

.buttons {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button,
select {
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 15px;
}

button {
  background: white;
  color: #111;
  cursor: pointer;
}

select {
  background: #222;
  color: white;
  border: 1px solid #444;
}

.controls {
  display: none;
  margin-top: 18px;
  padding: 16px;
  background: #151518;
  border-radius: 14px;
}

.control-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 12px;
}

.control-row:last-child {
  margin-bottom: 0;
}

.label {
  width: 70px;
  color: #aaa;
}

</style>

</head>

<body>

<main class="app">

<h1>CAMVIEW</h1>

<div class="video-box">

<video
  id="remoteVideo"
  autoplay
  playsinline>
</video>

<span id="message">
接続待機中
</span>

</div>

<div
  class="status"
  id="status">

サーバーに接続しています…

</div>

<div class="buttons">

<button id="cameraButton">
カメラを開始
</button>

<button id="viewerButton">
閲覧する
</button>

</div>

<!-- 閲覧側設定 -->

<div
  class="controls"
  id="viewerControls">

<div class="control-row">

<span class="label">
画質
</span>

<select id="qualitySelect">

<option value="auto">
自動
</option>

<option value="480">
480p
</option>

<option value="720" selected>
720p
</option>

<option value="1080">
1080p
</option>

</select>

</div>

<div class="control-row">

<span class="label">
FPS
</span>

<select id="fpsSelect">

<option value="auto">
自動
</option>

<option value="15">
15 FPS
</option>

<option value="24">
24 FPS
</option>

<option value="30" selected>
30 FPS
</option>

<option value="60">
60 FPS
</option>

</select>

</div>

<div class="control-row">

<button id="applyQuality">
設定を適用
</button>

</div>

<div class="control-row">

<button id="rearButton">
外カメラ
</button>

<button id="frontButton">
内カメラ
</button>

</div>

</div>

</main>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const room =
  "camview-main";

const remoteVideo =
  document.getElementById(
    "remoteVideo"
  );

const message =
  document.getElementById(
    "message"
  );

const status =
  document.getElementById(
    "status"
  );

const viewerControls =
  document.getElementById(
    "viewerControls"
  );

const qualitySelect =
  document.getElementById(
    "qualitySelect"
  );

const fpsSelect =
  document.getElementById(
    "fpsSelect"
  );

let peer = null;

let localStream = null;

let pendingIceCandidates = [];

let iceServersConfig = [

  {
    urls:
      "stun:stun.l.google.com:19302"
  }

];


// =====================================
// TURN設定
// =====================================

async function loadTurnConfig() {

  try {

    const response =
      await fetch(
        "/api/turn-config",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "TURN_CONFIG_UNAVAILABLE"
      );
    }

    const data =
      await response.json();

    if (
      Array.isArray(
        data.iceServers
      )
    ) {

      iceServersConfig =
        data.iceServers;

    }

  }

  catch (error) {

    console.warn(
      "TURN設定を取得できませんでした",
      error
    );

  }

}


// =====================================
// ICE
// =====================================

async function applyPendingIceCandidates() {

  if (
    !peer ||
    !peer.remoteDescription
  ) {

    return;

  }

  const list =
    pendingIceCandidates;

  pendingIceCandidates = [];

  for (
    const candidate of list
  ) {

    try {

      await peer.addIceCandidate(
        candidate
      );

    }

    catch (error) {

      console.warn(
        "ICE error:",
        error
      );

    }

  }

}


// =====================================
// PeerConnection
// =====================================

function createPeer() {

  peer =
    new RTCPeerConnection({

      iceServers:
        iceServersConfig,

      bundlePolicy:
        "max-bundle",

      rtcpMuxPolicy:
        "require",

      iceCandidatePoolSize:
        10

    });


  peer.onicecandidate =
    event => {

      if (
        !event.candidate
      ) {

        return;

      }

      socket.emit(
        "ice-candidate",
        {

          room,

          candidate:
            event.candidate

        }
      );

    };


  peer.ontrack =
    event => {

      if (
        !event.streams ||
        !event.streams[0]
      ) {

        return;

      }

      remoteVideo.srcObject =
        event.streams[0];

      remoteVideo.style.display =
        "block";

      message.style.display =
        "none";

      status.textContent =
        "映像・音声を受信しています";

      remoteVideo
        .play()
        .catch(() => {});

    };


  peer.onconnectionstatechange =
    () => {

      console.log(
        "Connection:",
        peer.connectionState
      );

      if (
        peer.connectionState ===
        "connected"
      ) {

        status.textContent =
          "接続しました";

      }

      if (
        peer.connectionState ===
        "connecting"
      ) {

        status.textContent =
          "接続しています…";

      }

      if (
        peer.connectionState ===
        "disconnected"
      ) {

        status.textContent =
          "接続が不安定です";

      }

      if (
        peer.connectionState ===
        "failed"
      ) {

        status.textContent =
          "接続に失敗しました";

      }

    };

}


// =====================================
// カメラ取得
// =====================================

async function getCamera(
  facingMode,
  quality,
  fps
) {

  let width = 1280;

  let height = 720;

  if (
    quality === "480"
  ) {

    width = 854;
    height = 480;

  }

  if (
    quality === "720"
  ) {

    width = 1280;
    height = 720;

  }

  if (
    quality === "1080"
  ) {

    width = 1920;
    height = 1080;

  }


  const frameRate =
    fps === "auto"
      ? 30
      : Number(fps);


  return navigator
    .mediaDevices
    .getUserMedia({

      video: {

        width: {
          ideal: width
        },

        height: {
          ideal: height
        },

        frameRate: {
          ideal: frameRate,
          max: frameRate
        },

        facingMode

      },

      audio: {

        echoCancellation:
          true,

        noiseSuppression:
          true,

        autoGainControl:
          true

      }

    });

}


// =====================================
// カメラ開始
// =====================================

document
  .getElementById(
    "cameraButton"
  )
  .addEventListener(
    "click",
    async () => {

      try {

        await loadTurnConfig();

        status.textContent =
          "カメラとマイクを起動しています…";


        localStream =
          await getCamera(
            "environment",
            "720",
            "30"
          );


        createPeer();


        for (
          const track of
          localStream.getTracks()
        ) {

          peer.addTrack(
            track,
            localStream
          );

        }


        socket.emit(
          "join",
          room
        );


        status.textContent =
          "カメラとして接続中";

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "カメラ・マイクを使用できません: " +
          error.name;

      }

    }
  );


// =====================================
// 閲覧開始
// =====================================

document
  .getElementById(
    "viewerButton"
  )
  .addEventListener(
    "click",
    async () => {

      await loadTurnConfig();

      createPeer();

      socket.emit(
        "join",
        room
      );

      viewerControls.style.display =
        "block";

      status.textContent =
        "カメラを探しています…";

    }
  );


// =====================================
// 画質・FPS変更
// =====================================

document
  .getElementById(
    "applyQuality"
  )
  .addEventListener(
    "click",
    () => {

      const quality =
        qualitySelect.value;

      const fps =
        fpsSelect.value;


      socket.emit(
        "change-quality",
        {

          room,

          quality,

          fps

        }
      );


      status.textContent =
        "画質・FPSを変更しています…";

    }
  );


// =====================================
// カメラ切替
// =====================================

document
  .getElementById(
    "rearButton"
  )
  .addEventListener(
    "click",
    () => {

      socket.emit(
        "switch-camera",
        {

          room,

          camera:
            "environment"

        }
      );

    }
  );


document
  .getElementById(
    "frontButton"
  )
  .addEventListener(
    "click",
    () => {

      socket.emit(
        "switch-camera",
        {

          room,

          camera:
            "user"

        }
      );

    }
  );


// =====================================
// カメラ切替命令
// =====================================

socket.on(
  "switch-camera",
  async data => {

    if (
      !localStream ||
      !data ||
      !data.camera
    ) {

      return;

    }


    try {

      const oldVideo =
        localStream
          .getVideoTracks()[0];


      const audio =
        localStream
          .getAudioTracks()[0];


      const newStream =
        await getCamera(
          data.camera,
          qualitySelect.value ===
            "auto"
            ? "720"
            : qualitySelect.value,
          fpsSelect.value ===
            "auto"
            ? "30"
            : fpsSelect.value
        );


      const newVideo =
        newStream
          .getVideoTracks()[0];


      if (oldVideo) {
        oldVideo.stop();
      }


      if (audio) {

        localStream =
          new MediaStream([
            audio,
            newVideo
          ]);

      }

      else {

        localStream =
          new MediaStream([
            newVideo
          ]);

      }


      if (peer) {

        const sender =
          peer
            .getSenders()
            .find(
              s =>
                s.track &&
                s.track.kind ===
                  "video"
            );


        if (sender) {

          await sender.replaceTrack(
            newVideo
          );

        }

      }


      status.textContent =
        data.camera ===
        "environment"
          ? "外カメラに切り替えました"
          : "内カメラに切り替えました";

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "カメラ切替に失敗しました";

    }

  }
);


// =====================================
// 画質変更命令
// =====================================

socket.on(
  "change-quality",
  async data => {

    if (
      !localStream ||
      !data
    ) {

      return;

    }


    try {

      const currentVideo =
        localStream
          .getVideoTracks()[0];

      const currentAudio =
        localStream
          .getAudioTracks()[0];


      let facingMode =
        "environment";


      if (
        currentVideo
          ?.getSettings()
          ?.facingMode
      ) {

        facingMode =
          currentVideo
            .getSettings()
            .facingMode;

      }


      const newStream =
        await getCamera(

          facingMode,

          data.quality ===
            "auto"
            ? "720"
            : data.quality,

          data.fps ===
            "auto"
            ? "30"
            : data.fps

        );


      const newVideo =
        newStream
          .getVideoTracks()[0];


      if (currentVideo) {
        currentVideo.stop();
      }


      if (currentAudio) {

        localStream =
          new MediaStream([
            currentAudio,
            newVideo
          ]);

      }

      else {

        localStream =
          new MediaStream([
            newVideo
          ]);

      }


      if (peer) {

        const sender =
          peer
            .getSenders()
            .find(
              s =>
                s.track &&
                s.track.kind ===
                  "video"
            );


        if (sender) {

          await sender.replaceTrack(
            newVideo
          );

        }

      }


      status.textContent =
        "画質・FPSを変更しました";

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "指定した画質・FPSに対応できませんでした";

    }

  }
);


// =====================================
// 相手が入室
// =====================================

socket.on(
  "peer-joined",
  async () => {

    if (
      !localStream ||
      !peer
    ) {

      return;

    }


    try {

      const offer =
        await peer.createOffer({

          offerToReceiveAudio:
            true,

          offerToReceiveVideo:
            true

        });


      await peer.setLocalDescription(
        offer
      );


      socket.emit(
        "offer",
        {

          room,

          offer

        }
      );

    }

    catch (error) {

      console.error(
        "Offer error:",
        error
      );

    }

  }
);


// =====================================
// Offer
// =====================================

socket.on(
  "offer",
  async offer => {

    try {

      if (!peer) {
        createPeer();
      }


      await peer.setRemoteDescription(
        offer
      );


      await applyPendingIceCandidates();


      const answer =
        await peer.createAnswer();


      await peer.setLocalDescription(
        answer
      );


      socket.emit(
        "answer",
        {

          room,

          answer

        }
      );

    }

    catch (error) {

      console.error(
        "Answer error:",
        error
      );

    }

  }
);


// =====================================
// Answer
// =====================================

socket.on(
  "answer",
  async answer => {

    try {

      if (!peer) {
        return;
      }


      await peer.setRemoteDescription(
        answer
      );


      await applyPendingIceCandidates();

    }

    catch (error) {

      console.error(
        "Answer受信エラー:",
        error
      );

    }

  }
);


// =====================================
// ICE Candidate
// =====================================

socket.on(
  "ice-candidate",
  async candidate => {

    try {

      if (!peer) {
        return;
      }


      if (
        !peer.remoteDescription
      ) {

        pendingIceCandidates.push(
          candidate
        );

        return;

      }


      await peer.addIceCandidate(
        candidate
      );

    }

    catch (error) {

      console.warn(
        "ICE candidate error:",
        error
      );

    }

  }
);


// =====================================
// 接続状態
// =====================================

socket.on(
  "connect",
  () => {

    status.textContent =
      "サーバーに接続しました";

  }
);


socket.on(
  "disconnect",
  () => {

    status.textContent =
      "サーバーから切断されました";

  }
);

</script>

</body>
</html>
