<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CAMVIEW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0d;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: min(920px, 94vw);
      padding: 24px 0 40px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 28px;
      letter-spacing: 2px;
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #151519;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #29292f;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #000;
    }

    #message {
      position: absolute;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #aaa;
      font-size: 15px;
    }

    .status {
      margin-top: 14px;
      min-height: 22px;

      color: #bbb;
      font-size: 14px;
    }

    .buttons,
    .camera-buttons,
    .talk-area,
    .quality-area {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;

      background: #fff;
      color: #111;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.97);
    }

    button.dark {
      background: #202025;
      color: #fff;
      border: 1px solid #35353d;
    }

    button.talk {
      background: #fff;
      min-width: 150px;
    }

    button.talk.active {
      background: #dcdcdc;
    }

    .camera-buttons,
    .talk-area,
    .quality-area {
      display: none;
    }

    .info {
      margin-top: 18px;
      padding: 14px;

      border-radius: 12px;
      background: #121216;
      border: 1px solid #25252b;

      color: #8f8f98;
      font-size: 12px;
      line-height: 1.7;
    }

    .telemetry {
      margin-top: 10px;

      color: #777;
      font-size: 11px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<main class="app">

  <h1>CAMVIEW</h1>

  <div class="video-box">

    <video
      id="remoteVideo"
      autoplay
      playsinline
      controls="false">
    </video>

    <span id="message">
      接続待機中
    </span>

  </div>

  <div
    id="status"
    class="status">
    サーバーに接続しています…
  </div>

  <div class="buttons">

    <button id="cameraButton">
      カメラを開始
    </button>

    <button id="viewerButton">
      閲覧する
    </button>

  </div>


  <!-- カメラ切替 -->

  <div
    id="cameraButtons"
    class="camera-buttons">

    <button
      id="rearButton"
      class="dark">
      外カメラ
    </button>

    <button
      id="frontButton"
      class="dark">
      内カメラ
    </button>

  </div>


  <!-- トーク -->

  <div
    id="talkArea"
    class="talk-area">

    <button
      id="talkButton"
      class="talk">
      押して話す
    </button>

  </div>


  <!-- 画質 -->

  <div
    id="qualityArea"
    class="quality-area">

    <button
      id="autoButton"
      class="dark">
      自動画質
    </button>

    <button
      id="quality480"
      class="dark">
      480p
    </button>

    <button
      id="quality720"
      class="dark">
      720p
    </button>

    <button
      id="quality1080"
      class="dark">
      1080p
    </button>

  </div>


  <div class="info">
    CAMVIEW はWebRTCを使用して
    端末間で映像・音声を通信します。
    通信が一時的に切れた場合は自動復旧を試みます。
  </div>

  <div
    id="telemetry"
    class="telemetry">
  </div>

</main>


<script src="/socket.io/socket.io.js"></script>

<script>

"use strict";


/* =====================================================
   基本設定
===================================================== */

const room = "camview-main";

const socket = io({
  reconnection: true,
  reconnectionAttempts: Infinity,
  reconnectionDelay: 1000,
  reconnectionDelayMax: 5000,
  timeout: 10000
});


const remoteVideo =
  document.getElementById("remoteVideo");

const message =
  document.getElementById("message");

const status =
  document.getElementById("status");

const telemetry =
  document.getElementById("telemetry");

const cameraButtons =
  document.getElementById("cameraButtons");

const talkArea =
  document.getElementById("talkArea");

const qualityArea =
  document.getElementById("qualityArea");

const talkButton =
  document.getElementById("talkButton");


/* =====================================================
   状態
===================================================== */

let peer = null;

let localStream = null;

let viewerMicStream = null;

let viewerMicTrack = null;

let isCamera = false;

let isViewer = false;

let currentFacingMode = "environment";

let currentDeviceId = null;

let iceQueue = [];

let reconnecting = false;

let autoQuality = true;

let currentQuality = "720";

let lastQualityChange = 0;

let goodSamples = 0;

let statsTimer = null;

let lastBytesReceived = 0;

let lastStatsTime = 0;


/* =====================================================
   Socket接続
===================================================== */

socket.on("connect", async () => {

  status.textContent =
    "サーバーに接続しました";

  if (isCamera || isViewer) {

    socket.emit("join", room);

    await wait(500);

    if (isViewer) {

      socket.emit(
        "request-offer",
        { room }
      );

    }

  }

});


socket.on("disconnect", () => {

  status.textContent =
    "サーバーから切断されました。再接続中…";

});


socket.on("connect_error", () => {

  status.textContent =
    "サーバーへ再接続しています…";

});


/* =====================================================
   WebRTC Peer作成
===================================================== */

async function getIceServers() {

  try {

    const response =
      await fetch(
        "/api/turn-config",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error("TURN unavailable");
    }

    const data =
      await response.json();

    return data.iceServers;

  } catch {

    return [
      {
        urls:
          "stun:stun.l.google.com:19302"
      }
    ];

  }

}


async function createPeer() {

  if (peer) {

    try {
      peer.close();
    } catch {}

  }

  const iceServers =
    await getIceServers();

  peer =
    new RTCPeerConnection({

      iceServers,

      bundlePolicy:
        "max-bundle",

      rtcpMuxPolicy:
        "require",

      iceCandidatePoolSize:
        10

    });


  peer.onicecandidate =
    event => {

      if (!event.candidate) {
        return;
      }

      socket.emit(
        "ice-candidate",
        {
          room,
          candidate:
            event.candidate
        }
      );

    };


  peer.ontrack =
    event => {

      if (!event.streams[0]) {
        return;
      }


      const stream =
        event.streams[0];


      if (
        event.track.kind ===
        "video"
      ) {

        remoteVideo.srcObject =
          stream;

        remoteVideo.style.display =
          "block";

        message.style.display =
          "none";

        remoteVideo
          .play()
          .catch(() => {});

      }


      /*
       * Viewerから送られてくる
       * トーク音声
       */

      if (
        event.track.kind ===
        "audio"
      ) {

        if (isCamera) {

          const audio =
            document.createElement(
              "audio"
            );

          audio.autoplay = true;
          audio.playsInline = true;

          audio.srcObject =
            new MediaStream([
              event.track
            ]);

          document.body.appendChild(
            audio
          );

          audio
            .play()
            .catch(() => {});

        }

      }

      status.textContent =
        "映像・音声を受信しています";

    };


  peer.onconnectionstatechange =
    async () => {

      if (!peer) {
        return;
      }

      const state =
        peer.connectionState;


      if (state === "connected") {

        reconnecting = false;

        status.textContent =
          "接続しました";

      }


      if (
        state === "disconnected"
      ) {

        status.textContent =
          "接続が不安定です。復旧しています…";

        scheduleRecovery();

      }


      if (
        state === "failed"
      ) {

        status.textContent =
          "接続が切れました。自動復旧しています…";

        scheduleRecovery();

      }


      if (
        state === "closed"
      ) {

        scheduleRecovery();

      }

    };


  peer.oniceconnectionstatechange =
    () => {

      if (!peer) {
        return;
      }

      const state =
        peer.iceConnectionState;

      if (
        state === "failed"
      ) {

        scheduleRecovery();

      }

    };

}


/* =====================================================
   カメラ開始
===================================================== */

async function startCamera(
  facingMode = "environment"
) {

  status.textContent =
    "カメラを起動しています…";


  try {

    const devices =
      await navigator
        .mediaDevices
        .enumerateDevices();


    const videoDevices =
      devices.filter(
        device =>
          device.kind ===
          "videoinput"
      );


    let selectedDevice =
      null;


    /*
     * まず現在とは違うカメラを探す。
     */

    if (
      currentDeviceId &&
      videoDevices.length > 1
    ) {

      const candidates =
        videoDevices.filter(
          d =>
            d.deviceId !==
            currentDeviceId
        );

      if (candidates.length) {

        selectedDevice =
          candidates[0];

      }

    }


    const videoConstraints =
      selectedDevice
        ? {
            deviceId: {
              exact:
                selectedDevice.deviceId
            },

            width: {
              ideal: 1280,
              max: 1280
            },

            height: {
              ideal: 720,
              max: 720
            },

            frameRate: {
              ideal: 30,
              max: 30
            }
          }

        : {

            width: {
              ideal: 1280,
              max: 1280
            },

            height: {
              ideal: 720,
              max: 720
            },

            frameRate: {
              ideal: 30,
              max: 30
            },

            facingMode

          };


    /*
     * 音声は既存のものをできるだけ維持。
     */

    let audioTrack = null;

    if (localStream) {

      audioTrack =
        localStream
          .getAudioTracks()[0];

    }


    const newVideoStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:
            videoConstraints,

          audio:
            !audioTrack
              ? {
                  echoCancellation:
                    true,

                  noiseSuppression:
                    true,

                  autoGainControl:
                    true
                }
              : false

        });


    const newVideoTrack =
      newVideoStream
        .getVideoTracks()[0];


    if (!newVideoTrack) {
      throw new Error(
        "カメラを取得できませんでした"
      );
    }


    currentDeviceId =
      newVideoTrack
        .getSettings()
        .deviceId || null;


    currentFacingMode =
      facingMode;


    /*
     * Peerの映像を差し替え
     */

    if (peer) {

      const sender =
        peer
          .getSenders()
          .find(
            s =>
              s.track &&
              s.track.kind ===
              "video"
          );


      if (sender) {

        await sender.replaceTrack(
          newVideoTrack
        );

      } else {

        peer.addTrack(
          newVideoTrack,
          new MediaStream([
            newVideoTrack
          ])
        );

      }

    }


    /*
     * 古い映像を停止
     */

    if (localStream) {

      localStream
        .getVideoTracks()
        .forEach(
          track => {

            if (
              track !==
              newVideoTrack
            ) {

              track.stop();

            }

          }
        );

    }


    /*
     * 新しいlocalStreamを作成
     */

    if (audioTrack) {

      localStream =
        new MediaStream([
          newVideoTrack,
          audioTrack
        ]);

    } else {

      const newAudio =
        newVideoStream
          .getAudioTracks()[0];

      localStream =
        new MediaStream(
          newAudio
            ? [
                newVideoTrack,
                newAudio
              ]
            : [
                newVideoTrack
              ]
        );

    }


    attachTrackRecovery(
      newVideoTrack
    );


    status.textContent =
      facingMode ===
      "environment"
        ? "外カメラで動作中"
        : "内カメラで動作中";


    return true;

  } catch (error) {

    console.error(error);

    status.textContent =
      "カメラ復旧に失敗しました: "
      + error.name;

    return false;

  }

}


/* =====================================================
   カメラ・マイクの監視
===================================================== */

function attachTrackRecovery(
  track
) {

  if (!track) {
    return;
  }


  track.addEventListener(
    "ended",
    () => {

      if (!isCamera) {
        return;
      }

      setTimeout(
        () => recoverCamera(),
        1000
      );

    }
  );


  track.addEventListener(
    "mute",
    () => {

      if (!isCamera) {
        return;
      }

      setTimeout(
        () => recoverCamera(),
        1500
      );

    }
  );

}


async function recoverCamera() {

  if (!isCamera) {
    return;
  }

  status.textContent =
    "カメラを自動復旧しています…";


  const oldAudio =
    localStream
      ?.getAudioTracks()[0];


  const success =
    await startCamera(
      currentFacingMode
    );


  if (
    success &&
    oldAudio &&
    !oldAudio.ended
  ) {

    attachTrackRecovery(
      oldAudio
    );

  }

}


/* =====================================================
   カメラ開始ボタン
===================================================== */

document
  .getElementById(
    "cameraButton"
  )
  .addEventListener(
    "click",
    async () => {

      isCamera = true;
      isViewer = false;

      cameraButtons.style.display =
        "flex";

      qualityArea.style.display =
        "flex";

      talkArea.style.display =
        "none";


      try {

        localStream =
          await navigator
            .mediaDevices
            .getUserMedia({

              video: {

                width: {
                  ideal: 1280,
                  max: 1280
                },

                height: {
                  ideal: 720,
                  max: 720
                },

                frameRate: {
                  ideal: 30,
                  max: 30
                },

                facingMode:
                  "environment"

              },

              audio: {

                echoCancellation:
                  true,

                noiseSuppression:
                  true,

                autoGainControl:
                  true

              }

            });


        const videoTrack =
          localStream
            .getVideoTracks()[0];


        if (videoTrack) {

          currentDeviceId =
            videoTrack
              .getSettings()
              .deviceId ||
            null;

          attachTrackRecovery(
            videoTrack
          );

        }


        const audioTrack =
          localStream
            .getAudioTracks()[0];


        if (audioTrack) {

          attachTrackRecovery(
            audioTrack
          );

        }


        await createPeer();


        localStream
          .getTracks()
          .forEach(
            track => {

              peer.addTrack(
                track,
                localStream
              );

            }
          );


        socket.emit(
          "join",
          room
        );


        status.textContent =
          "カメラとして接続中";


        startAutoQuality();

      } catch (error) {

        console.error(error);

        status.textContent =
          "カメラ・マイクを使用できません: "
          + error.name;

      }

    }
  );


/* =====================================================
   Viewer開始
===================================================== */

document
  .getElementById(
    "viewerButton"
  )
  .addEventListener(
    "click",
    async () => {

      isViewer = true;
      isCamera = false;


      cameraButtons.style.display =
        "flex";

      talkArea.style.display =
        "flex";

      qualityArea.style.display =
        "none";


      try {

        /*
         * Viewer側のマイク。
         * 最初はミュート状態。
         */

        viewerMicStream =
          await navigator
            .mediaDevices
            .getUserMedia({

              audio: {

                echoCancellation:
                  true,

                noiseSuppression:
                  true,

                autoGainControl:
                  true

              },

              video: false

            });


        viewerMicTrack =
          viewerMicStream
            .getAudioTracks()[0];


        viewerMicTrack.enabled =
          false;


        await createPeer();


        /*
         * Viewerのトーク用マイクを
         * Peerに追加
         */

        peer.addTrack(
          viewerMicTrack,
          viewerMicStream
        );


        socket.emit(
          "join",
          room
        );


        status.textContent =
          "カメラを探しています…";


        socket.emit(
          "request-offer",
          { room }
        );


      } catch (error) {

        console.error(error);

        status.textContent =
          "マイクを使用できません: "
          + error.name;

      }

    }
  );


/* =====================================================
   カメラ切替
===================================================== */

document
  .getElementById(
    "rearButton"
  )
  .addEventListener(
    "click",
    () => {

      socket.emit(
        "switch-camera",
        {
          room,
          camera:
            "environment"
        }
      );


      status.textContent =
        "外カメラへ切り替えています…";

    }
  );


document
  .getElementById(
    "frontButton"
  )
  .addEventListener(
    "click",
    () => {

      socket.emit(
        "switch-camera",
        {
          room,
          camera:
            "user"
        }
      );


      status.textContent =
        "内カメラへ切り替えています…";

    }
  );


socket.on(
  "switch-camera",
  async data => {

    if (!isCamera) {
      return;
    }

    await startCamera(
      data.camera
    );

  }
);


/* =====================================================
   Offer作成
===================================================== */

async function makeOffer() {

  if (
    !isCamera ||
    !peer ||
    !localStream
  ) {

    return;

  }


  try {

    const offer =
      await peer.createOffer({

        offerToReceiveAudio:
          true,

        offerToReceiveVideo:
          true

      });


    await peer.setLocalDescription(
      offer
    );


    socket.emit(
      "offer",
      {
        room,
        offer
      }
    );

  } catch (error) {

    console.error(
      "offer error:",
      error
    );

  }

}


/* =====================================================
   ViewerからOffer要求
===================================================== */

socket.on(
  "request-offer",
  async () => {

    if (isCamera) {

      await makeOffer();

    }

  }
);


/* =====================================================
   相手が入室
===================================================== */

socket.on(
  "peer-joined",
  async () => {

    if (isCamera) {

      await wait(300);

      await makeOffer();

    }

  }
);


/* =====================================================
   Offer受信
===================================================== */

socket.on(
  "offer",
  async offer => {

    try {

      if (!peer) {

        await createPeer();

      }


      await peer.setRemoteDescription(
        new RTCSessionDescription(
          offer
        )
      );


      /*
       * 先に届いていたICEを処理
       */

      await flushIce();


      const answer =
        await peer.createAnswer();


      await peer.setLocalDescription(
        answer
      );


      socket.emit(
        "answer",
        {
          room,
          answer
        }
      );


      status.textContent =
        "接続処理中…";

    } catch (error) {

      console.error(
        "offer error:",
        error
      );

      status.textContent =
        "接続処理でエラーが発生しました";

    }

  }
);


/* =====================================================
   Answer
===================================================== */

socket.on(
  "answer",
  async answer => {

    try {

      if (!peer) {
        return;
      }


      await peer.setRemoteDescription(
        new RTCSessionDescription(
          answer
        )
      );


      await flushIce();

    } catch (error) {

      console.error(
        "answer error:",
        error
      );

    }

  }
);


/* =====================================================
   ICE
===================================================== */

socket.on(
  "ice-candidate",
  async candidate => {

    if (!peer) {
      return;
    }


    if (
      peer.remoteDescription &&
      peer.remoteDescription.type
    ) {

      try {

        await peer.addIceCandidate(
          candidate
        );

      } catch (error) {

        console.error(
          "ICE error:",
          error
        );

      }

    } else {

      iceQueue.push(
        candidate
      );

    }

  }
);


async function flushIce() {

  if (!peer) {
    return;
  }


  const queue =
    [...iceQueue];

  iceQueue = [];


  for (
    const candidate
    of queue
  ) {

    try {

      await peer.addIceCandidate(
        candidate
      );

    } catch {}

  }

}


/* =====================================================
   トーク
===================================================== */

function talkStart(event) {

  if (!isViewer) {
    return;
  }

  event.preventDefault();


  if (!viewerMicTrack) {
    return;
  }


  viewerMicTrack.enabled =
    true;


  talkButton.classList.add(
    "active"
  );


  talkButton.textContent =
    "話しています…";

}


function talkStop(event) {

  if (!isViewer) {
    return;
  }

  event.preventDefault();


  if (!viewerMicTrack) {
    return;
  }


  viewerMicTrack.enabled =
    false;


  talkButton.classList.remove(
    "active"
  );


  talkButton.textContent =
    "押して話す";

}


talkButton.addEventListener(
  "pointerdown",
  talkStart
);

talkButton.addEventListener(
  "pointerup",
  talkStop
);

talkButton.addEventListener(
  "pointercancel",
  talkStop
);

talkButton.addEventListener(
  "pointerleave",
  talkStop
);


/* =====================================================
   画質設定
===================================================== */

const profiles = {

  "480": {
    width: 854,
    height: 480,
    fps: 15
  },

  "720": {
    width: 1280,
    height: 720,
    fps: 30
  },

  "1080": {
    width: 1920,
    height: 1080,
    fps: 30
  }

};


async function applyQuality(
  quality
) {

  if (!isCamera || !localStream) {
    return;
  }


  const profile =
    profiles[quality];

  if (!profile) {
    return;
  }


  const videoTrack =
    localStream
      .getVideoTracks()[0];


  if (!videoTrack) {
    return;
  }


  try {

    await videoTrack.applyConstraints({

      width: {
        ideal:
          profile.width
      },

      height: {
        ideal:
          profile.height
      },

      frameRate: {
        ideal:
          profile.fps,
        max:
          profile.fps
      }

    });


    const sender =
      peer
        ?.getSenders()
        .find(
          s =>
            s.track &&
            s.track.kind ===
            "video"
        );


    if (sender) {

      const params =
        sender.getParameters();

      if (!params.encodings) {
        params.encodings =
          [{}];
      }


      params.encodings[0]
        .maxBitrate =
          quality === "480"
            ? 700000
            : quality === "720"
              ? 1800000
              : 3500000;


      await sender.setParameters(
        params
      );

    }


    currentQuality =
      quality;

    lastQualityChange =
      Date.now();


  } catch (error) {

    console.error(
      "quality error:",
      error
    );

  }

}


document
  .getElementById(
    "quality480"
  )
  .onclick = () => {

    autoQuality = false;

    applyQuality("480");

  };


document
  .getElementById(
    "quality720"
  )
  .onclick = () => {

    autoQuality = false;

    applyQuality("720");

  };


document
  .getElementById(

  .onclick = () => {

    autoQuality = false;

    applyQuality("1080");

  };


document
  .getElementById(

    autoQuality = true;

    goodSamples = 0;

    status.textContent =
      "自動画質調整を開始しました";

  };


/* =====================================================
   自動画質調整
===================================================== */

function startAutoQuality() {

  if (statsTimer) {
    clearInterval(statsTimer);
  }


  statsTimer =
    setInterval(
      checkNetwork,
      3000
    );

}


async function checkNetwork() {

  if (
    !isCamera ||
    !autoQuality ||
    !peer ||
    peer.connectionState !==
      "connected"
  ) {

    return;

  }


  try {

    const stats =
      await peer.getStats();


    let inboundBytes =
      0;

    let packetsLost =
      0;

    let packetsReceived =
      0;

    let dropped =
      0;

    let rtt =
      0;


    stats.forEach(
      report => {

        if (
          report.type ===
          "inbound-rtp" &&
          report.kind ===
          "video"
        ) {

          inboundBytes =
            report.bytesReceived || 0;

          packetsLost =
            report.packetsLost || 0;

          packetsReceived =
            report.packetsReceived || 0;

          dropped =
            report.framesDropped || 0;

        }


        if (
          report.type ===
          "candidate-pair" &&
          report.state ===
          "succeeded"
        ) {

          if (
            typeof report.currentRoundTripTime ===
            "number"
          ) {

            rtt =
              report.currentRoundTripTime *
              1000;

          }

        }

      }
    );


    const now =
      Date.now();


    let bitrate =
      0;


    if (
      lastStatsTime > 0
    ) {

      const bytesDelta =
        Math.max(
          0,
          inboundBytes -
          lastBytesReceived
        );


      const timeDelta =
        Math.max(
          1,
          now -
          lastStatsTime
        );


      bitrate =
        bytesDelta *
        8 *
        1000 /
        timeDelta;

    }


    lastBytesReceived =
      inboundBytes;

    lastStatsTime =
      now;


    const totalPackets =
      packetsLost +
      packetsReceived;


    const loss =
      totalPackets > 0
        ? packetsLost /
          totalPackets *
          100
        : 0;


    telemetry.textContent =
      `品質 ${currentQuality}p / ` +
      `RTT ${Math.round(rtt)}ms / ` +
      `Loss ${loss.toFixed(1)}% / ` +
      `Bitrate ${(bitrate / 1000000).toFixed(2)}Mbps`;


    const bad =
      loss > 5 ||
      dropped > 30 ||
      rtt > 350 ||
      (
        bitrate > 0 &&
        bitrate < 550000
      );


    const good =
      loss < 1.5 &&
      dropped < 8 &&
      rtt < 200 &&
      (
        bitrate === 0 ||
        bitrate > 1200000
      );


    const elapsed =
      Date.now() -
      lastQualityChange;


    if (
      bad &&
      elapsed > 8000
    ) {

      goodSamples = 0;


      if (
        currentQuality ===
        "1080"
      ) {

        await applyQuality(
          "720"
        );

      } else if (
        currentQuality ===
        "720"
      ) {

        await applyQuality(
          "480"
        );

      }

      return;

    }


    if (good) {

      goodSamples++;

    } else {

      goodSamples = 0;

    }


    if (
      goodSamples >= 3 &&
      elapsed > 10000
    ) {

      if (
        currentQuality ===
        "480"
      ) {

        await applyQuality(
          "720"
        );

        goodSamples = 0;

      } else if (
        currentQuality ===
        "720"
      ) {

        await applyQuality(
          "1080"
        );

        goodSamples = 0;

      }

    }

  } catch (error) {

    console.error(
      "stats error:",
      error
    );

  }

}


/* =====================================================
   自動復旧
===================================================== */

let recoveryTimer = null;


function scheduleRecovery() {

  if (recoveryTimer) {
    return;
  }


  recoveryTimer =
    setTimeout(
      async () => {

        recoveryTimer =
          null;

        await recoverConnection();

      },
      2000
    );

}


async function recoverConnection() {

  if (reconnecting) {
    return;
  }


  if (
    !isCamera &&
    !isViewer
  ) {

    return;

  }


  reconnecting = true;


  status.textContent =
    "接続を自動復旧しています…";


  try {

    if (isCamera) {

      /*
       * カメラ側は既存ストリームを維持して
       * Peerだけ作り直す。
       */

      await createPeer();


      if (localStream) {

        localStream
          .getTracks()
          .forEach(
            track => {

              if (!track.ended) {

                peer.addTrack(
                  track,
                  localStream
                );

              }

            }
          );

      }


      socket.emit(
        "join",
        room
      );


      await wait(500);

      await makeOffer();

    }


    if (isViewer) {

      await createPeer();


      if (
        viewerMicTrack &&
        !viewerMicTrack.ended
      ) {

        peer.addTrack(
          viewerMicTrack,
          viewerMicStream
        );

      }


      socket.emit(
        "join",
        room
      );


      await wait(500);


      socket.emit(
        "request-offer",
        { room }
      );

    }

  } catch (error) {

    console.error(
      "recovery error:",
      error
    );

  }


  reconnecting = false;

}


/* =====================================================
   バックグラウンド復帰
===================================================== */

async function checkAfterResume() {

  if (
    !isCamera &&
    !isViewer
  ) {

    return;

  }


  status.textContent =
    "接続状態を確認しています…";


  /*
   * Camera側
   */

  if (isCamera) {

    const videoTrack =
      localStream
        ?.getVideoTracks()[0];

    const audioTrack =
      localStream
        ?.getAudioTracks()[0];


    if (
      !videoTrack ||
      videoTrack.readyState ===
      "ended" ||
      videoTrack.muted
    ) {

      await recoverCamera();

    }


    if (
      audioTrack &&
      audioTrack.readyState ===
      "ended"
    ) {

      try {

        const mic =
          await navigator
            .mediaDevices
            .getUserMedia({
              audio: true,
              video: false
            });


        const newAudio =
          mic.getAudioTracks()[0];


        const sender =
          peer
            ?.getSenders()
            .find(
              s =>
                s.track &&
                s.track.kind ===
                "audio"
            );


        if (sender) {

          await sender.replaceTrack(
            newAudio
          );

        }


        const video =
          localStream
            ?.getVideoTracks()[0];


        localStream =
          new MediaStream(
            [
              ...(video
                ? [video]
                : []),
              newAudio
            ]
          );

      } catch {}

    }

  }


  /*
   * Viewer側
   */

  if (isViewer) {

    if (
      viewerMicTrack &&
      viewerMicTrack.readyState ===
      "ended"
    ) {

      try {

        const mic =
          await navigator
            .mediaDevices
            .getUserMedia({
              audio: true,
              video: false
            });


        viewerMicStream =
          mic;

        viewerMicTrack =
          mic.getAudioTracks()[0];

        viewerMicTrack.enabled =
          false;


        const sender =
          peer
            ?.getSenders()
            .find(
              s =>
                s.track &&
                s.track.kind ===
                "audio"
            );


        if (sender) {

          await sender.replaceTrack(
            viewerMicTrack
          );

        }

      } catch {}

    }

  }


  /*
   * Peerが壊れていたら再接続
   */

  if (
    !peer ||
    peer.connectionState ===
      "failed" ||
    peer.connectionState ===
      "closed"
  ) {

    scheduleRecovery();

  } else if (
    peer.connectionState ===
    "disconnected"
  ) {

    setTimeout(
      () => {

        if (
          peer &&
          peer.connectionState !==
          "connected"
        ) {

          scheduleRecovery();

        }

      },
      3000
    );

  } else {

    status.textContent =
      "接続中";

  }

}


/* =====================================================
   visibilitychange
===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      setTimeout(
        checkAfterResume,
        500
      );

    }

  }
);

===================================================== */

window.addEventListener(

);


/* =====================================================

===================================================== */

window.addEventListener(

/* =====================================================
   ネットワーク
===================================================== */

window.addEventListener(
  "online",
  () => {

    status.textContent =
      "ネットワーク復旧。接続を確認しています…";

    scheduleRecovery();

  }
);


window.addEventListener(
  "offline",
  () => {

    status.textContent =
      "オフラインです。ネットワーク復旧を待っています…";

  }
);


/* =====================================================
   待機
===================================================== */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}

   初期表示

status.textContent =
