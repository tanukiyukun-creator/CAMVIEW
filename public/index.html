<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAMVIEW</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#09090b;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
  max-width:1100px;
  margin:auto;
  padding:22px;
}

h1{
  margin:0 0 16px;
}

.video{
  position:relative;
  aspect-ratio:16/9;
  background:#151518;
  border-radius:18px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.video video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
  display:none;
}

.msg{
  color:#777;
}

.status{
  margin-top:12px;
  color:#aaa;
  min-height:20px;
  font-size:14px;
}

.buttons,
.sub{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
}

button,
select{
  border:0;
  border-radius:11px;
  padding:12px 16px;
  font-size:15px;
}

button{
  background:#fff;
  color:#111;
  cursor:pointer;
}

button.secondary{
  background:#222;
  color:#fff;
  border:1px solid #444;
}

button.talking{
  background:#ccc;
}

.panel{
  margin-top:16px;
  padding:16px;
  border:1px solid #29292d;
  border-radius:16px;
  background:#101014;
}

.row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin:9px 0;
  color:#bbb;
}

.panel.hidden,
.sub.hidden{
  display:none;
}

.telemetry{
  margin-top:12px;
  color:#888;
  font-size:12px;
}
</style>
</head>

<body>

<main class="app">

<h1>CAMVIEW</h1>

<div class="video">

  <video
    id="remote"
    autoplay
    playsinline>
  </video>

  <span
    id="msg"
    class="msg">
    接続待機中
  </span>

</div>

<div
  id="status"
  class="status">
  サーバーに接続しています…
</div>

<div class="buttons">

  <button id="camera">
    カメラを開始
  </button>

  <button id="viewer">
    閲覧する
  </button>

  <button
    id="settings"
    class="secondary">
    設定
  </button>

</div>

<div
  id="cameraControls"
  class="sub hidden">

  <button
    id="rear"
    class="secondary">
    外カメラ
  </button>

  <button
    id="front"
    class="secondary">
    内カメラ
  </button>

  <button
    id="talk"
    class="talk">
    押している間だけ話す
  </button>

</div>

<div
  id="panel"
  class="panel hidden">

  <b>映像設定</b>

  <div class="row">

    画質

    <select id="quality">

      <option value="auto">
        自動
      </option>

      <option value="480">
        480p
      </option>

      <option value="720">
        720p
      </option>

      <option value="1080">
        1080p
      </option>

    </select>

  </div>

  <div class="row">

    FPS

    <select id="fps">

      <option value="auto">
        自動
      </option>

      <option value="15">
        15 FPS
      </option>

      <option value="30">
        30 FPS
      </option>

      <option value="60">
        60 FPS
      </option>

    </select>

  </div>

  <div class="row">
    初期状態は自動。通信状況に合わせて最大1080p / 60FPSまで自動調整します。
  </div>

</div>

<div
  id="telemetry"
  class="telemetry">
</div>

</main>

<script src="/socket.io/socket.io.js"></script>

<script>
"use strict";

const room = "camview-main";

const socket = io({
  reconnection: true,
  reconnectionAttempts: Infinity,
  reconnectionDelay: 1000,
  reconnectionDelayMax: 5000
});

const remote =
  document.getElementById("remote");

const msg =
  document.getElementById("msg");

const status =
  document.getElementById("status");

const controls =
  document.getElementById("cameraControls");

const talk =
  document.getElementById("talk");

const panel =
  document.getElementById("panel");

const telemetry =
  document.getElementById("telemetry");

const qsel =
  document.getElementById("quality");

const fsel =
  document.getElementById("fps");


let peer = null;

let local = null;

let mic = null;

let micTrack = null;

let role = null;

let facing = "environment";

let turn = null;

let recovery = null;

let statsTimer = null;

let last = null;

let lastChange = 0;

let goodSamples = 0;

let autoIndex = 2;

let ice = [];


const profiles = [

  ["480",15],

  ["720",30],

  ["1080",30],

  ["1080",60]

];


function setStatus(text){

  status.textContent = text;

}


/* =====================================
   TURN設定
===================================== */

async function turnConfig(){

  try{

    const r =
      await fetch(
        "/api/turn-config",
        {cache:"no-store"}
      );

    if(!r.ok)
      throw new Error();

    turn =
      await r.json();

  }catch(e){

    console.warn(
      "TURN config unavailable"
    );

    turn = {

      iceServers:[

        {
          urls:
            "stun:stun.l.google.com:19302"
        }

      ]

    };

  }

  return turn;

}


/* =====================================
   Peer作成
===================================== */

async function makePeer(){

  if(peer){

    try{
      peer.close();
    }catch(e){}

  }

  const config =
    turn ||
    await turnConfig();

  peer =
    new RTCPeerConnection({

      iceServers:
        config.iceServers || config,

      bundlePolicy:
        "max-bundle",

      rtcpMuxPolicy:
        "require",

      iceCandidatePoolSize:
        10

    });


  ice = [];


  peer.onicecandidate =
    event => {

      if(event.candidate){

        socket.emit(
          "ice-candidate",
          {
            room,
            candidate:
              event.candidate
          }
        );

      }

    };


  peer.ontrack =
    event => {

      if(
        event.track.kind ===
        "video" &&
        event.streams[0]
      ){

        remote.srcObject =
          event.streams[0];

        remote.style.display =
          "block";

        msg.style.display =
          "none";

        remote.play()
          .catch(()=>{});

        setStatus(
          "映像・音声を受信しています"
        );

      }


      if(
        event.track.kind ===
        "audio" &&
        event.streams[0]
      ){

        let audio =
          document.getElementById(
            "talkAudio"
          );

        if(!audio){

          audio =
            document.createElement(
              "audio"
            );

          audio.id =
            "talkAudio";

          audio.autoplay =
            true;

          audio.playsInline =
            true;

          document.body.appendChild(
            audio
          );

        }

        audio.srcObject =
          event.streams[0];

        audio.play()
          .catch(()=>{});

      }


      event.track.onended =
        () => {

          recover(
            "トラック終了"
          );

        };

    };


  peer.onconnectionstatechange =
    () => {

      if(!peer)
        return;

      const state =
        peer.connectionState;

      if(state === "connected"){

        setStatus(
          role === "camera"
            ? "カメラとして接続しました"
            : "接続しました"
        );

      }

      if(state === "connecting"){

        setStatus(
          "接続しています…"
        );

      }

      if(
        state === "disconnected" ||
        state === "failed"
      ){

        recover(
          "WebRTC " + state
        );

      }

    };


  peer.oniceconnectionstatechange =
    () => {

      if(
        peer.iceConnectionState ===
        "failed"
      ){

        recover(
          "ICE failed"
        );

      }

    };


  if(
    role === "camera" &&
    local
  ){

    local
      .getTracks()
      .forEach(
        track =>
          peer.addTrack(
            track,
            local
          )
      );

  }


  if(
    role === "viewer" &&
    mic
  ){

    mic
      .getTracks()
      .forEach(
        track =>
          peer.addTrack(
            track,
            mic
          )
      );

  }

}


/* =====================================
   ICE
===================================== */

async function flushIce(){

  if(
    !peer ||
    !peer.remoteDescription
  )
    return;

  for(
    const candidate
    of ice.splice(0)
  ){

    try{

      await peer.addIceCandidate(
        candidate
      );

    }catch(e){}

  }

}


/* =====================================
   カメラ開始
===================================== */

async function cameraStart(
  face = facing,
  quality = qsel.value,
  fps = fsel.value
){

  if(role !== "camera")
    return;


  const profile =
    profiles[autoIndex];


  const q =
    quality === "auto"
      ? profile[0]
      : quality;


  const f =
    fps === "auto"
      ? profile[1]
      : Number(fps);


  const height =
    q === "1080"
      ? 1080
      : q === "720"
        ? 720
        : 480;


  const width =
    q === "1080"
      ? 1920
      : q === "720"
        ? 1280
        : 854;


  try{

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            width:{
              ideal:width,
              max:width
            },

            height:{
              ideal:height,
              max:height
            },

            frameRate:{
              ideal:f,
              max:f
            },

            facingMode:face

          },

          audio:{

            echoCancellation:true,

            noiseSuppression:true,

            autoGainControl:true

          }

        });


    const videoTrack =
      stream
        .getVideoTracks()[0];

    const audioTrack =
      stream
        .getAudioTracks()[0];


    if(peer){

      const videoSender =
        peer
          .getSenders()
          .find(
            s =>
              s.track?.kind ===
              "video"
          );


      const audioSender =
        peer
          .getSenders()
          .find(
            s =>
              s.track?.kind ===
              "audio"
          );


      if(videoSender){

        await videoSender
          .replaceTrack(
            videoTrack
          );

      }else{

        peer.addTrack(
          videoTrack,
          stream
        );

      }


      if(audioSender){

        await audioSender
          .replaceTrack(
            audioTrack
          );

      }else{

        peer.addTrack(
          audioTrack,
          stream
        );

      }

    }


    if(local){

      local
        .getTracks()
        .forEach(
          track => {

            try{
              track.stop();
            }catch(e){}

          }
        );

    }


    local =
      stream;

    facing =
      face;


    const actual =
      videoTrack.getSettings();


    setStatus(
      `カメラ接続中 — ${
        actual.width || width
      }×${
        actual.height || height
      } / ${
        actual.frameRate || f
      }FPS`
    );


  }catch(error){

    /*
      60FPS非対応端末なら
      30FPSへ自動フォールバック
    */

    if(f === 60){

      try{

        const fallback =
          await navigator
            .mediaDevices
            .getUserMedia({

              video:{

                width:{
                  ideal:width,
                  max:width
                },

                height:{
                  ideal:height,
                  max:height
                },

                frameRate:{
                  ideal:30,
                  max:30
                },

                facingMode:face

              },

              audio:true

            });


        const videoTrack =
          fallback
            .getVideoTracks()[0];


        const sender =
          peer
            ?.getSenders()
            .find(
              s =>
                s.track?.kind ===
                "video"
            );


        if(sender){

          await sender
            .replaceTrack(
              videoTrack
            );

        }else if(peer){

          peer.addTrack(
            videoTrack,
            fallback
          );

        }


        if(local){

          local
            .getVideoTracks()
            .forEach(
              track =>
                track.stop()
            );

        }


        local =
          fallback;


        setStatus(
          "60FPS非対応のため30FPSで接続しました"
        );

        return;

      }catch(e){}

    }


    setStatus(
      "カメラを使用できません: " +
      error.name
    );

  }

}


/* =====================================
   閲覧側マイク
===================================== */

async function viewerMic(){

  try{

    mic =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:{

            echoCancellation:true,

            noiseSuppression:true,

            autoGainControl:true

          }

        });


    micTrack =
      mic.getAudioTracks()[0];


    micTrack.enabled =
      false;


  }catch(e){

    setStatus(
      "マイクは使用できません。映像は利用できます"
    );

  }

}


/* =====================================
   Offer
===================================== */

async function offer(){

  if(
    role !== "camera" ||
    !peer ||
    !local
  )
    return;


  try{

    const offer =
      await peer.createOffer({

        offerToReceiveAudio:
          true,

        offerToReceiveVideo:
          true

      });


    await peer.setLocalDescription(
      offer
    );


    socket.emit(
      "offer",
      {
        room,
        offer
      }
    );

  }catch(e){

    console.error(e);

  }

}


/* =====================================
   自動復旧
===================================== */

function recover(reason){

  if(
    recovery ||
    !role
  )
    return;


  recovery =
    setTimeout(
      async () => {

        recovery =
          null;

        try{

          await turnConfig();

          await makePeer();


          if(
            role === "camera"
          ){

            await cameraStart();

          }


          socket.emit(
            "join",
            room
          );


        }catch(e){

          recover(
            "retry"
          );

        }

      },
      1200
    );

}


/* =====================================
   Socket
===================================== */

socket.on(
  "connect",
  () => {

    if(role){

      socket.emit(
        "join",
        room
      );


      setStatus(
        role === "camera"
          ? "サーバーに接続しました。待機中…"
          : "カメラを探しています…"
      );

    }else{

      setStatus(
        "サーバーに接続しました"
      );

    }

  }
);


socket.on(
  "disconnect",
  () => {

    if(role){

      setStatus(
        "サーバー切断。自動復旧中…"
      );

    }

  }
);


socket.on(
  "peer-joined",
  () => {

    if(
      role === "camera"
    ){

      offer();

    }

  }
);


socket.on(
  "request-offer",
  () => {

    if(
      role === "camera"
    ){

      offer();

    }

  }
);


/* =====================================
   Offer受信
===================================== */

socket.on(
  "offer",
  async incomingOffer => {

    try{

      if(!peer){

        await makePeer();

      }


      await peer.setRemoteDescription(
        incomingOffer
      );


      await flushIce();


      const answer =
        await peer.createAnswer();


      await peer.setLocalDescription(
        answer
      );


      socket.emit(
        "answer",
        {
          room,
          answer
        }
      );

    }catch(e){

      recover(
        "offer"
      );

    }

  }
);


/* =====================================
   Answer受信
===================================== */

socket.on(
  "answer",
  async answer => {

    try{

      if(!peer)
        return;


      await peer
        .setRemoteDescription(
          answer
        );


      await flushIce();

    }catch(e){

      recover(
        "answer"
      );

    }

  }
);


/* =====================================
   ICE受信
===================================== */

socket.on(
  "ice-candidate",
  async candidate => {

    if(
      !peer ||
      !peer.remoteDescription
    ){

      ice.push(
        candidate
      );

      return;

    }


    try{

      await peer.addIceCandidate(
        candidate
      );

    }catch(e){}

  }
);


/* =====================================
   カメラ切替
===================================== */

socket.on(
  "switch-camera",
  data => {

    if(
      role !== "camera"
    )
      return;


    cameraStart(
      data.camera === "user"
        ? "user"
        : "environment"
    );

  }
);


/* =====================================
   画質・FPS変更
===================================== */

socket.on(
  "change-quality",
  async data => {

    if(
      role !== "camera" ||
      !local
    )
      return;


    const track =
      local
        .getVideoTracks()[0];


    if(!track)
      return;


    const profile =
      profiles[autoIndex];


    const q =
      data.quality === "auto"
        ? profile[0]
        : data.quality;


    const f =
      data.fps === "auto"
        ? profile[1]
        : Number(data.fps);


    const height =
      q === "1080"
        ? 1080
        : q === "720"
          ? 720
          : 480;


    const width =
      q === "1080"
        ? 1920
        : q === "720"
          ? 1280
          : 854;


    try{

      await track.applyConstraints({

        width:{
          ideal:width,
          max:width
        },

        height:{
          ideal:height,
          max:height
        },

        frameRate:{
          ideal:f,
          max:f
        }

      });

    }catch(e){

      console.warn(e);

    }

  }
);


/* =====================================
   ボタン
===================================== */

document
  .getElementById("camera")
  .onclick =
  async () => {

    if(role)
      return;


    role =
      "camera";


    controls
      .classList
      .remove("hidden");


    talk.style.display =
      "none";


    await turnConfig();

    await makePeer();

    await cameraStart();

    socket.emit(
      "join",
      room
    );

  };


document
  .getElementById("viewer")
  .onclick =
  async () => {

    if(role)
      return;


    role =
      "viewer";


    controls
      .classList
      .remove("hidden");


    talk.style.display =
      "block";


    await turnConfig();

    await viewerMic();

    await makePeer();


    socket.emit(
      "join",
      room
    );


    startStats();


    setStatus(
      "カメラを探しています…"
    );

  };


document
  .getElementById("rear")
  .onclick =
  () => {

    if(
      role === "viewer"
    ){

      socket.emit(
        "switch-camera",
        {
          room,
          camera:"environment"
        }
      );

    }

  };


document
  .getElementById("front")
  .onclick =
  () => {

    if(
      role === "viewer"
    ){

      socket.emit(
        "switch-camera",
        {
          room,
          camera:"user"
        }
      );

    }

  };


/* =====================================
   トーク
===================================== */

function talkOn(value){

  if(micTrack){

    micTrack.enabled =
      value;

  }


  talk.classList
    .toggle(
      "talking",
      value
    );


  talk.textContent =
    value
      ? "話しています…"
      : "押している間だけ話す";

}


talk.onpointerdown =
  event => {

    event.preventDefault();

    talkOn(true);

  };


[
  "pointerup",
  "pointercancel",
  "pointerleave"
]
.forEach(
  type => {

    talk.addEventListener(
      type,
      event => {

        event.preventDefault();

        talkOn(false);

      }
    );

  }
);


window.onblur =
  () => talkOn(false);


/* =====================================
   設定
===================================== */

document
  .getElementById("settings")
  .onclick =
  () => {

    panel
      .classList
      .toggle("hidden");

  };


async function settingsChanged(){

  const quality =
    qsel.value;

  const fps =
    fsel.value;


  /*
    自動なら何も考えなくてOK
  */

  if(
    role === "camera"
  ){

    await cameraStart(
      facing,
      quality,
      fps
    );

  }


  if(
    role === "viewer"
  ){

    socket.emit(
      "change-quality",
      {
        room,
        quality,
        fps
      }
    );

  }

}


qsel.onchange =
  settingsChanged;


fsel.onchange =
  settingsChanged;


/* =====================================
   自動通信調整
===================================== */

async function autoStats(){

  if(
    role !== "viewer" ||
    !peer ||
    peer.connectionState !==
      "connected" ||
    qsel.value !== "auto" ||
    fsel.value !== "auto"
  )
    return;


  const now =
    performance.now();


  const stats =
    await peer.getStats();


  let inbound =
    null;

  let rtt =
    0;


  stats.forEach(
    report => {

      if(
        report.type ===
          "inbound-rtp" &&
        report.kind ===
          "video"
      ){

        inbound =
          report;

      }


      if(
        report.type ===
          "candidate-pair" &&
        report.state ===
          "succeeded" &&
        typeof report.currentRoundTripTime ===
          "number"
      ){

        rtt =
          report.currentRoundTripTime *
          1000;

      }

    }
  );


  if(!inbound)
    return;


  const bytes =
    inbound.bytesReceived || 0;

  const packets =
    inbound.packetsReceived || 0;

  const lost =
    inbound.packetsLost || 0;

  const dropped =
    inbound.framesDropped || 0;


  if(last){

    const dt =
      Math.max(
        0.1,
        (now - last.time) /
        1000
      );


    const bitrate =
      (bytes - last.bytes) *
      8 /
      dt /
      1000000;


    const received =
      Math.max(
        0,
        packets - last.packets
      );


    const lostDelta =
      Math.max(
        0,
        lost - last.lost
      );


    const loss =
      (
        lostDelta /
        Math.max(
          1,
          received + lostDelta
        )
      ) * 100;


    const droppedDelta =
      Math.max(
        0,
        dropped - last.dropped
      );


    telemetry.textContent =
      `通信状態：${
        bitrate.toFixed(2)
      }Mbps / loss ${
        loss.toFixed(1)
      }% / RTT ${
        Math.round(rtt)
      }ms / drop ${
        droppedDelta
      }`;


    const bad =
      loss > 5 ||
      droppedDelta > 30 ||
      rtt > 350 ||
      bitrate < 0.55;


    const good =
      loss < 1.5 &&
      droppedDelta < 8 &&
      rtt < 200 &&
      bitrate > 1.2;


    if(
      bad &&
      autoIndex > 0 &&
      now - lastChange > 8000
    ){

      autoIndex--;

      lastChange =
        now;

      goodSamples =
        0;


      const p =
        profiles[autoIndex];


      socket.emit(
        "change-quality",
        {
          room,
          quality:p[0],
          fps:p[1]
        }
      );


      setStatus(
        `自動調整：${p[0]}p / ${p[1]}FPS`
      );

    }


    else if(good){

      goodSamples++;


      if(
        goodSamples >= 3 &&
        autoIndex < 3 &&
        now - lastChange > 10000
      ){

        autoIndex++;

        lastChange =
          now;

        goodSamples =
          0;


        const p =
          profiles[autoIndex];


        socket.emit(
          "change-quality",
          {
            room,
            quality:p[0],
            fps:p[1]
          }
        );


        setStatus(
          `自動調整：${p[0]}p / ${p[1]}FPS`
        );

      }

    }

  }


  last = {

    time:now,

    bytes,

    packets,

    lost,

    dropped

  };

}


/* =====================================
   統計開始
===================================== */

function startStats(){

  if(statsTimer){

    clearInterval(
      statsTimer
    );

  }


  statsTimer =
    setInterval(
      autoStats,
      3000
    );

}


/* =====================================
   復帰処理
===================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState ===
      "visible"
    ){

      setTimeout(
        () => {

          if(
            role === "camera"
          ){

            const track =
              local
                ?.getVideoTracks()
                ?. [0];


            if(
              !track ||
              track.readyState ===
                "ended"
            ){

              recover(
                "camera resume"
              );

            }

          }


          if(
            role === "viewer"
          ){

            if(
              !peer ||
              peer.connectionState ===
                "failed" ||
              peer.connectionState ===
                "closed"
            ){

              recover(
                "viewer resume"
              );

            }

          }


          remote
            .play()
            .catch(()=>{});

        },
        300
      );

    }
    else{

      talkOn(false);

    }

  }
);


window.addEventListener(
  "pageshow",
  () => recover("pageshow")
);


window.addEventListener(
  "focus",
  () => recover("focus")
);


window.addEventListener(
  "online",
  () => recover("online")
);


window.addEventListener(
  "offline",
  () => {

    setStatus(
      "オフラインです。接続を待っています…"
    );

  }
);

</script>
