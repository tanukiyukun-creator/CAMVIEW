<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMVIEW</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #09090b;
  color: #fff;
  font-family: Arial, sans-serif;
}

.app {
  width: min(1100px, 100%);
  margin: auto;
  padding: 24px;
}

h1 {
  margin: 0 0 20px;
  font-size: 28px;
}

.video-box {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #151518;
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
  background: #000;
}

#message {
  color: #777;
  font-size: 16px;
}

.status {
  margin-top: 14px;
  color: #aaa;
  font-size: 14px;
  line-height: 1.6;
}

.buttons,
.camera-buttons,
.viewer-controls {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.camera-buttons,
.viewer-controls {
  display: none;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 13px 20px;
  background: #fff;
  color: #111;
  font-size: 15px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

button:active {
  transform: scale(0.98);
}

.dark-button {
  background: #222;
  color: #fff;
  border: 1px solid #444;
}

.talk-button {
  background: #fff;
  min-width: 130px;
}

.talk-button.active {
  background: #333;
  color: #fff;
  border: 1px solid #666;
}

.auto-status {
  margin-top: 10px;
  color: #888;
  font-size: 13px;
}

select {
  background: #222;
  color: #fff;
  border: 1px solid #444;
  border-radius: 10px;
  padding: 12px;
}
</style>
</head>

<body>

<main class="app">

  <h1>CAMVIEW</h1>

  <div class="video-box">

    <video
      id="remoteVideo"
      autoplay
      playsinline>
    </video>

    <span id="message">
      接続待機中
    </span>

  </div>

  <div id="status" class="status">
    サーバーに接続しています…
  </div>

  <div class="buttons">

    <button id="cameraButton">
      カメラを開始
    </button>

    <button id="viewerButton">
      閲覧する
    </button>

  </div>


  <!-- 閲覧側コントロール -->

  <div
    id="viewerControls"
    class="viewer-controls">

    <button
      id="talkButton"
      class="talk-button">
      🎙 話す
    </button>

    <button
      id="rearButton"
      class="dark-button">
      外カメラ
    </button>

    <button
      id="frontButton"
      class="dark-button">
      内カメラ
    </button>

    <select id="qualitySelect">
      <option value="auto">解像度：自動</option>
      <option value="480">480p</option>
      <option value="720">720p</option>
      <option value="1080">1080p</option>
    </select>

    <select id="fpsSelect">
      <option value="auto">FPS：自動</option>
      <option value="15">15 FPS</option>
      <option value="24">24 FPS</option>
      <option value="30">30 FPS</option>
    </select>

  </div>


  <div
    id="cameraButtons"
    class="camera-buttons">
  </div>

  <div
    id="autoStatus"
    class="auto-status">
  </div>

</main>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const room = "camview-main";

const remoteVideo =
  document.getElementById("remoteVideo");

const message =
  document.getElementById("message");

const status =
  document.getElementById("status");

const viewerControls =
  document.getElementById("viewerControls");

const talkButton =
  document.getElementById("talkButton");

const qualitySelect =
  document.getElementById("qualitySelect");

const fpsSelect =
  document.getElementById("fpsSelect");

const autoStatus =
  document.getElementById("autoStatus");


let peer = null;

let localStream = null;

let viewerMicStream = null;

let viewerMicTrack = null;

let isCamera = false;

let isViewer = false;

let currentFacingMode = "environment";

let iceQueue = [];

let autoTimer = null;

let lastQualityChange = 0;

let goodSamples = 0;

let lastProfile = null;


/* ==================================================
   TURN
================================================== */

async function getIceServers() {

  try {

    const response =
      await fetch("/api/turn-config");

    if (!response.ok) {
      throw new Error("TURN config error");
    }

    const data =
      await response.json();

    return data.iceServers;

  }

  catch (error) {

    console.warn(
      "TURN設定を取得できません:",
      error
    );

    return [
      {
        urls:
          "stun:stun.l.google.com:19302"
      }
    ];

  }

}


/* ==================================================
   Peer
================================================== */

async function createPeer() {

  const iceServers =
    await getIceServers();

  peer =
    new RTCPeerConnection({

      iceServers,

      bundlePolicy:
        "max-bundle",

      rtcpMuxPolicy:
        "require",

      iceCandidatePoolSize:
        10

    });


  peer.onicecandidate =
    event => {

      if (!event.candidate) {
        return;
      }

      socket.emit(
        "ice-candidate",
        {
          room,
          candidate:
            event.candidate
        }
      );

    };


  peer.ontrack =
    event => {

      if (!event.streams[0]) {
        return;
      }

      /*
       * 映像・カメラ側音声
       */

      if (
        event.track.kind === "video" ||
        isViewer
      ) {

        remoteVideo.srcObject =
          event.streams[0];

        remoteVideo.style.display =
          "block";

        message.style.display =
          "none";

        remoteVideo
          .play()
          .catch(() => {});

      }


      /*
       * カメラ側で閲覧者の声を受信
       */

      if (
        isCamera &&
        event.track.kind === "audio"
      ) {

        const voiceAudio =
          document.createElement("audio");

        voiceAudio.autoplay = true;

        voiceAudio.playsInline = true;

        voiceAudio.srcObject =
          event.streams[0];

        voiceAudio.dataset.camviewVoice =
          "true";

        document.body.appendChild(
          voiceAudio
        );

        voiceAudio
          .play()
          .catch(() => {});

      }

    };


  peer.onconnectionstatechange =
    () => {

      if (!peer) {
        return;
      }

      const state =
        peer.connectionState;

      if (state === "connected") {

        status.textContent =
          "接続しました";

      }

      else if (
        state === "disconnected"
      ) {

        status.textContent =
          "接続が不安定です";

      }

      else if (
        state === "failed"
      ) {

        status.textContent =
          "接続に失敗しました";

      }

    };

}


/* ==================================================
   ICE候補
================================================== */

async function flushIceCandidates() {

  if (!peer) {
    return;
  }

  while (
    iceQueue.length > 0 &&
    peer.remoteDescription
  ) {

    const candidate =
      iceQueue.shift();

    try {

      await peer.addIceCandidate(
        candidate
      );

    }

    catch (error) {

      console.warn(
        "ICE追加エラー:",
        error
      );

    }

  }

}


/* ==================================================
   カメラ取得
   ★音声を維持して映像だけ交換
================================================== */

async function switchCamera(
  facingMode
) {

  if (!isCamera) {
    return;
  }

  status.textContent =
    "カメラを切り替えています…";


  const oldVideoTrack =
    localStream
      ?.getVideoTracks()[0];


  /*
   * まず現在のトラックに
   * facingMode変更を試す
   */

  if (oldVideoTrack) {

    try {

      await oldVideoTrack.applyConstraints({

        facingMode: {
          exact: facingMode
        }

      });

      currentFacingMode =
        facingMode;

      status.textContent =
        facingMode === "environment"
          ? "外カメラに切り替えました"
          : "内カメラに切り替えました";

      return;

    }

    catch (error) {

      console.log(
        "既存トラック切替に失敗。新しいトラックを取得します。"
      );

    }

  }


  /*
   * fallback
   */

  try {

    const newStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            width: {
              ideal: 1280,
              max: 1280
            },

            height: {
              ideal: 720,
              max: 720
            },

            frameRate: {
              ideal: 30,
              max: 30
            },

            facingMode

          },

          audio: false

        });


    const newVideoTrack =
      newStream
        .getVideoTracks()[0];


    if (!newVideoTrack) {
      throw new Error(
        "映像トラックを取得できません"
      );
    }


    const sender =
      peer
        ?.getSenders()
        .find(
          s =>
            s.track &&
            s.track.kind === "video"
        );


    if (sender) {

      await sender.replaceTrack(
        newVideoTrack
      );

    }


    if (oldVideoTrack) {

      oldVideoTrack.stop();

    }


    const audioTrack =
      localStream
        ?.getAudioTracks()[0];


    localStream =
      new MediaStream();


    localStream.addTrack(
      newVideoTrack
    );

    if (audioTrack) {

      localStream.addTrack(
        audioTrack
      );

    }


    currentFacingMode =
      facingMode;


    status.textContent =
      facingMode === "environment"
        ? "外カメラに切り替えました"
        : "内カメラに切り替えました";

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "カメラ切替エラー: " +
      error.name;

  }

}


/* ==================================================
   カメラ開始
================================================== */

document
  .getElementById("cameraButton")
  .addEventListener(
    "click",
    async () => {

      isCamera = true;
      isViewer = false;

      status.textContent =
        "カメラとマイクを起動しています…";


      try {

        localStream =
          await navigator
            .mediaDevices
            .getUserMedia({

              video: {

                width: {
                  ideal: 1280,
                  max: 1280
                },

                height: {
                  ideal: 720,
                  max: 720
                },

                frameRate: {
                  ideal: 30,
                  max: 30
                },

                facingMode:
                  "environment"

              },

              audio: {

                echoCancellation: true,

                noiseSuppression: true,

                autoGainControl: true

              }

            });


        await createPeer();


        localStream
          .getTracks()
          .forEach(
            track => {

              peer.addTrack(
                track,
                localStream
              );

            }
          );


        socket.emit(
          "join",
          room
        );


        status.textContent =
          "カメラとして接続中";


      }

      catch (error) {

        console.error(error);

        status.textContent =
          "カメラ・マイクを使用できません: " +
          error.name;

      }

    }
  );


/* ==================================================
   閲覧開始
================================================== */

document
  .getElementById("viewerButton")
  .addEventListener(
    "click",
    async () => {

      isViewer = true;
      isCamera = false;

      status.textContent =
        "マイクを準備しています…";


      try {

        /*
         * 閲覧側マイク
         */

        viewerMicStream =
          await navigator
            .mediaDevices
            .getUserMedia({

              audio: {

                echoCancellation: true,

                noiseSuppression: true,

                autoGainControl: true

              },

              video: false

            });


        viewerMicTrack =
          viewerMicStream
            .getAudioTracks()[0];


        /*
         * 最初はミュート
         * 「話す」を押したときだけON
         */

        viewerMicTrack.enabled = false;


        await createPeer();


        /*
         * 閲覧側のマイクを
         * WebRTCに追加
         */

        peer.addTrack(
          viewerMicTrack,
          viewerMicStream
        );


        socket.emit(
          "join",
          room
        );


        viewerControls.style.display =
          "flex";


        status.textContent =
          "カメラを探しています…";

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "マイクを使用できません: " +
          error.name;

      }

    }
  );


/* ==================================================
   話すボタン
   押している間だけマイクON
================================================== */

function startTalking(event) {

  if (event) {
    event.preventDefault();
  }

  if (!viewerMicTrack) {
    return;
  }

  viewerMicTrack.enabled = true;

  talkButton.classList.add(
    "active"
  );

  talkButton.textContent =
    "🎙 話しています…";

}


function stopTalking(event) {

  if (event) {
    event.preventDefault();
  }

  if (!viewerMicTrack) {
    return;
  }

  viewerMicTrack.enabled = false;

  talkButton.classList.remove(
    "active"
  );

  talkButton.textContent =
    "🎙 話す";

}


/*
 * スマホ・PC両対応
 */

talkButton.addEventListener(
  "pointerdown",
  startTalking
);

talkButton.addEventListener(
  "pointerup",
  stopTalking
);

talkButton.addEventListener(
  "pointercancel",
  stopTalking
);

talkButton.addEventListener(
  "pointerleave",
  event => {

    if (
      event.buttons === 0
    ) {
      stopTalking(event);
    }

  }
);


/* ==================================================
   カメラ切替ボタン
================================================== */

document
  .getElementById("rearButton")
  .addEventListener(
    "click",
    () => {

      socket.emit(
        "switch-camera",
        {
          room,
          camera:
            "environment"
        }
      );

      status.textContent =
        "外カメラへ切り替えています…";

    }
  );


document
  .getElementById("frontButton")
  .addEventListener(
    "click",
    () => {

      socket.emit(
        "switch-camera",
        {
          room,
          camera:
            "user"
        }
      );

      status.textContent =
        "内カメラへ切り替えています…";

    }
  );


/* ==================================================
   カメラ側：切替命令
================================================== */

socket.on(
  "switch-camera",
  async data => {

    if (!isCamera) {
      return;
    }

    await switchCamera(
      data.camera
    );

  }
);


/* ==================================================
   Offer
================================================== */

socket.on(
  "offer",
  async offer => {

    try {

      if (!peer) {

        await createPeer();

      }


      await peer.setRemoteDescription(
        offer
      );


      await flushIceCandidates();


      const answer =
        await peer.createAnswer({

          offerToReceiveAudio:
            true,

          offerToReceiveVideo:
            true

        });


      await peer.setLocalDescription(
        answer
      );


      socket.emit(
        "answer",
        {
          room,
          answer
        }
      );

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "接続処理でエラーが発生しました";

    }

  }
);


/* ==================================================
   Answer
================================================== */

socket.on(
  "answer",
  async answer => {

    try {

      if (!peer) {
        return;
      }

      await peer.setRemoteDescription(
        answer
      );

      await flushIceCandidates();

    }

    catch (error) {

      console.error(error);

    }

  }
);


/* ==================================================
   ICE
================================================== */

socket.on(
  "ice-candidate",
  async candidate => {

    if (!peer) {
      return;
    }


    /*
     * remoteDescriptionがまだ無い場合は
     * 一旦保存する
     */

    if (!peer.remoteDescription) {

      iceQueue.push(
        candidate
      );

      return;

    }


    try {

      await peer.addIceCandidate(
        candidate
      );

    }

    catch (error) {

      console.warn(
        "ICEエラー:",
        error
      );

    }

  }
);


/* ==================================================
   相手が入室
================================================== */

socket.on(
  "peer-joined",
  async () => {

    /*
     * カメラ側だけOfferを作る
     */

    if (
      !isCamera ||
      !peer ||
      !localStream
    ) {

      return;

    }


    try {

      const offer =
        await peer.createOffer({

          offerToReceiveAudio:
            true,

          offerToReceiveVideo:
            true

        });


      await peer.setLocalDescription(
        offer
      );


      socket.emit(
        "offer",
        {
          room,
          offer
        }
      );

    }

    catch (error) {

      console.error(error);

    }

  }
);


/* ==================================================
   自動画質調整
================================================== */

function getVideoSender() {

  if (!peer) {
    return null;
  }

  return peer
    .getSenders()
    .find(
      s =>
        s.track &&
        s.track.kind === "video"
    );

}


async function applyQuality(
  quality,
  fps
) {

  if (!isCamera || !localStream) {
    return;
  }


  const track =
    localStream
      .getVideoTracks()[0];


  if (!track) {
    return;
  }


  let width = 1280;
  let height = 720;
  let maxBitrate = 1500000;


  if (quality === "480") {

    width = 854;
    height = 480;
    maxBitrate = 500000;

  }

  else if (quality === "720") {

    width = 1280;
    height = 720;
    maxBitrate = 1500000;

  }

  else if (quality === "1080") {

    width = 1920;
    height = 1080;
    maxBitrate = 2500000;

  }


  let frameRate = 30;


  if (fps !== "auto") {

    frameRate =
      Number(fps);

  }


  try {

    await track.applyConstraints({

      width: {
        ideal: width,
        max: width
      },

      height: {
        ideal: height,
        max: height
      },

      frameRate: {
        ideal: frameRate,
        max: frameRate
      }

    });

  }

  catch (error) {

    console.warn(
      "画質設定:",
      error
    );

  }


  const sender =
    getVideoSender();


  if (!sender) {
    return;
  }


  try {

    const parameters =
      sender.getParameters();


    if (!parameters.encodings) {

      parameters.encodings = [
        {}
      ];

    }


    parameters.encodings[0]
      .maxBitrate =
      maxBitrate;


    parameters.encodings[0]
      .maxFramerate =
      frameRate;


    await sender.setParameters(
      parameters
    );

  }

  catch (error) {

    console.warn(
      "送信設定:",
      error
    );

  }

}


/* ==================================================
   手動画質
================================================== */

qualitySelect.addEventListener(
  "change",
  () => {

    if (
      qualitySelect.value !== "auto" ||
      fpsSelect.value !== "auto"
    ) {

      stopAuto();

      socket.emit(
        "change-quality",
        {
          room,
          quality:
            qualitySelect.value,
          fps:
            fpsSelect.value
        }
      );

      status.textContent =
        "画質設定を変更しました";

    }

    else {

      startAuto();

    }

  }
);


fpsSelect.addEventListener(
  "change",
  () => {

    if (
      qualitySelect.value !== "auto" ||
      fpsSelect.value !== "auto"
    ) {

      stopAuto();

      socket.emit(
        "change-quality",
        {
          room,
          quality:
            qualitySelect.value,
          fps:
            fpsSelect.value
        }
      );

    }

    else {

      startAuto();

    }

  }
);


/* ==================================================
   カメラ側：画質変更
================================================== */

socket.on(
  "change-quality",
  async data => {

    await applyQuality(
      data.quality,
      data.fps
    );

  }
);


/* ==================================================
   自動調整
================================================== */

function startAuto() {

  stopAuto();

  goodSamples = 0;

  lastProfile = null;

  autoStatus.textContent =
    "自動調整：測定中…";


  autoTimer =
    setInterval(
      measureNetwork,
      3000
    );

}


function stopAuto() {

  if (autoTimer) {

    clearInterval(
      autoTimer
    );

    autoTimer = null;

  }

}


async function measureNetwork() {

  if (
    !peer ||
    peer.connectionState !==
      "connected"
  ) {

    return;

  }


  try {

    const stats =
      await peer.getStats();


    let bytes = 0;

    let packetsLost = 0;

    let packets = 0;

    let framesDropped = 0;

    let rtt = null;


    stats.forEach(
      report => {

        if (
          report.type ===
            "inbound-rtp" &&
          report.kind ===
            "video"
        ) {

          bytes =
            report.bytesReceived ||
            0;

          packetsLost =
            report.packetsLost ||
            0;

          packets =
            report.packetsReceived ||
            0;

          framesDropped =
            report.framesDropped ||
            0;

        }


        if (
          report.type ===
            "candidate-pair" &&
          report.state ===
            "succeeded"
        ) {

          if (
            report.currentRoundTripTime !=
            null
          ) {

            rtt =
              report.currentRoundTripTime
              * 1000;

          }

        }

      }
    );


    const loss =
      packets > 0
        ? packetsLost /
          (packets + packetsLost)
        : 0;


    const lossPercent =
      loss * 100;


    const bitrateMbps =
      (bytes * 8) /
      3000000;


    autoStatus.textContent =
      "自動調整： " +
      bitrateMbps.toFixed(2) +
      " Mbps / loss " +
      lossPercent.toFixed(1) +
      "% / RTT " +
      (rtt != null
        ? rtt.toFixed(0) + "ms"
        : "測定中");


    /*
     * 悪化
     */

    const bad =
      lossPercent > 5 ||
      framesDropped > 30 ||
      (rtt != null &&
       rtt > 350) ||
      bitrateMbps < 0.55;


    /*
     * 良好
     */

    const good =
      lossPercent < 1.5 &&
      framesDropped < 8 &&
      (rtt == null ||
       rtt < 200) &&
      bitrateMbps > 1.2;


    const now =
      Date.now();


    if (bad) {

      goodSamples = 0;


      if (
        now - lastQualityChange >
        8000
      ) {

        lastQualityChange =
          now;

        await autoLower();

      }

      return;

    }


    if (good) {

      goodSamples++;

    }

    else {

      goodSamples = 0;

    }


    if (
      goodSamples >= 3 &&
      now - lastQualityChange >
        10000
    ) {

      lastQualityChange =
        now;

      goodSamples = 0;

      await autoRaise();

    }

  }

  catch (error) {

    console.warn(
      "Stats error:",
      error
    );

  }

}


/* ==================================================
   自動で画質を下げる
================================================== */

async function autoLower() {

  const profiles = [

    {
      quality: "480",
      fps: "15"
    },

    {
      quality: "720",
      fps: "30"
    },

    {
      quality: "1080",
      fps: "30"
    }

  ];


  let index =
    profiles.findIndex(
      p =>
        p.quality ===
          lastProfile?.quality &&
        p.fps ===
          lastProfile?.fps
    );


  if (index < 0) {
    index = 2;
  }


  index =
    Math.max(0, index - 1);


  const profile =
    profiles[index];


  lastProfile =
    profile;


  socket.emit(
    "change-quality",
    {
      room,
      quality:
        profile.quality,
      fps:
        profile.fps
    }
  );

}


/* ==================================================
   自動で画質を上げる
================================================== */

async function autoRaise() {

  const profiles = [

    {
      quality: "480",
      fps: "15"
    },

    {
      quality: "720",
      fps: "30"
    },

    {
      quality: "1080",
      fps: "30"
    }

  ];


  let index =
    profiles.findIndex(
      p =>
        p.quality ===
          lastProfile?.quality &&
        p.fps ===
          lastProfile?.fps
    );


  if (index < 0) {
    index = 0;
  }


  index =
    Math.min(
      profiles.length - 1,
      index + 1
    );


  const profile =
    profiles[index];


  lastProfile =
    profile;


  socket.emit(
    "change-quality",
    {
      room,
      quality:
        profile.quality,
      fps:
        profile.fps
    }
  );

}
